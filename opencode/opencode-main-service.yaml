# クラスタ外(自宅の main ホスト)の OpenCode 認証プロキシ。
# main は prod ノードと同じ LAN(192.168.1.0/24)にいる。
# 認証プロキシ(:4096)はパスワードを自動付与するため、必ず oauth2-proxy を経由させること。
apiVersion: v1
kind: Service
metadata:
  name: opencode-main
  namespace: kigawa-net-opencode
spec:
  ports:
    - name: http
      port: 80
      targetPort: 4096
      protocol: TCP
