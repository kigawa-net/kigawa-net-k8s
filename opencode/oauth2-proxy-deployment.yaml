apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode-oauth2-proxy
  namespace: kigawa-net-opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencode-oauth2-proxy
  template:
    metadata:
      labels:
        app: opencode-oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://user.kigawa.net/realms/develop
            - --client-id=opencode
            # パブリッククライアント + PKCE。クライアントシークレットは使わない(ダミー値)
            - --client-secret=unused
            - --code-challenge-method=S256
            - --redirect-url=https://opencode.kigawa.net/oauth2/callback
            - --upstream=http://opencode-main.kigawa-net-opencode.svc.cluster.local:80
            - --http-address=0.0.0.0:4180
            - --authenticated-emails-file=/etc/oauth2-proxy/emails.txt
            - --email-domain=*
            - --skip-provider-button=true
            - --cookie-secure=true
            - --cookie-expire=168h
            - --reverse-proxy=true
            - --pass-access-token=false
            - --pass-authorization-header=false
            - --upstream-timeout=3600s
            - --flush-interval=100ms
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: opencode-oauth2-proxy-secret
                  key: cookie-secret
          ports:
            - containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
          volumeMounts:
            - name: config
              mountPath: /etc/oauth2-proxy
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: opencode-oauth2-proxy-config
