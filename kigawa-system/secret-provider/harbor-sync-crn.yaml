apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-sync-crn
spec:
  schedule: "*/5 * * * *"  # Run every 5 minutes
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        spec:
          serviceAccountName: sec-sync-sa
          restartPolicy: OnFailure
          containers:
            - name: create-secret
              env:
                - name: TARGET_NAMESPACES
                  value: |
                    kigawa-net-keruta-dev
                    kigawa-net-keruta-main
                    kigawa-net-lp-main
                    develop
                    prometheus
                    kigawa-net-mamoru-main
                    onemc-rpgcore
                    onemc-rpgcore-stg
                    onemc-rpgcore-dev
                    onemc-build
                    kigawa-net-el4s-realtime
                    platform-lipl-stg
                - name: DYNAMIC_NAMESPACE_PATTERNS
                  value: |
                    ^platform-lipl-dev-pr-[0-9]+$
              image: bitnami/kubectl:latest
              command:
                - /bin/bash
                - -c
                - |
                  set -e

                  # Read username and password from source secret
                  USERNAME=$(kubectl get secret harbor-sec -o jsonpath='{.data.user}' | base64 -d)
                  PASSWORD=$(kubectl get secret harbor-sec -o jsonpath='{.data.pass}' | base64 -d)

                  sync_namespace() {
                    local namespace="$1"
                    # Create or update the harbor-registry secret with correct type
                    if ! kubectl create secret docker-registry harbor-registry \
                      --docker-server=harbor.kigawa.net \
                      --docker-username="$USERNAME" \
                      --docker-password="$PASSWORD" \
                      --dry-run=client -o yaml -n "$namespace" | kubectl apply -f -; then
                      echo "WARN: failed to sync harbor-registry to $namespace, skipping" >&2
                      return 0
                    fi

                    echo "Secret harbor-registry synced successfully at $(date) to $namespace"
                  }

                  echo "$TARGET_NAMESPACES" | while read -r namespace; do
                    if [[ -z "$namespace" ]]; then continue; fi
                    sync_namespace "$namespace"
                  done

                  # PRごとに動的生成されるnamespace（platform-lipl-dev-pr-<N> 等）を
                  # 実在するnamespace一覧から正規表現でマッチさせて同期する
                  all_namespaces=$(kubectl get namespaces -o jsonpath='{.items[*].metadata.name}')
                  echo "$DYNAMIC_NAMESPACE_PATTERNS" | while read -r pattern; do
                    if [[ -z "$pattern" ]]; then continue; fi
                    for namespace in $all_namespaces; do
                      if [[ "$namespace" =~ $pattern ]]; then
                        sync_namespace "$namespace"
                      fi
                    done
                  done
