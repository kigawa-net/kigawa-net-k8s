# harbor-registry Secret の全 namespace 同期 CronJob
#
# 【2026-02-16 → 2026-10-03 事故記録】
# 2026-02-16 02:45 実行の Job (harbor-sync-crn-29520165) が
# serviceAccountName `keruta-dev-sa` を指定していたが、当該 ServiceAccount が
# 存在せず Pod が 1 つも作れなかった(complete しない active Job として残留)。
# concurrencyPolicy が Forbid だったため CronJob 自身が永久にブロックされ、
# LAST SCHEDULE が 2026-02-16 で停止したまま 47h(≒2日)続き、
# platform-exkes-stg / platform-exkes-main をはじめとする全 namespace で
# harbor-registry Secret が配布されない状態が続いた(手動でゾンビ Job を
# 削除して 2026-10-03 に復旧)。
#
# 【再発防止策】
# 1. concurrencyPolicy: Forbid → Allow
#    1つの実行が詰まっていても CronJob 全体がブロックされなくなる。
#    並列実行の accumulation リスクは startingDeadlineSeconds と
#    activeDeadlineSeconds で抑える(下記)。
# 2. startingDeadlineSeconds + activeDeadlineSeconds(120s)で、
#    実行が詰まる/长时间化する場合は強制タイムアウトさせて失敗・後始末させる。
# 3. serviceAccountName の実在をレビューする(manifest には
#    実在する `sec-sync-sa` を指定している)。
#
# 参考: worker5のcontainerd詰まりでkigawa-net-secret-provider
# namespaceにContainerCreatingのPodが42個蓄積した事故を受けた再発防止策。
# concurrencyPolicy未設定(デフォルトAllow)だと、前回実行がPendingの
# まま詰まっていても5分毎に新しい実行が無制限に積み重なってしまうため、
# startingDeadlineSecondsでスキップし、activeDeadlineSecondsで
# 詰まったPodを強制的にタイムアウト・失敗させることで無限蓄積を防ぐ。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-sync-crn
spec:
  schedule: "*/5 * * * *"  # Run every 5 minutes
  # ゾンビ Job(never-complete)が発生しても CronJob 自身が永久ブロック
  # されないよう Forbid ではなく Allow とする。
  # 重複実行の积累は startingDeadlineSeconds と
  # jobTemplate.spec.activeDeadlineSeconds で抑え、個別 Job が
  # 2分で必ず終了(成功 or 失敗)するようにする。
  concurrencyPolicy: Allow
  startingDeadlineSeconds: 180
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: sec-sync-sa
          restartPolicy: OnFailure
          containers:
            - name: create-secret
              env:
                # exkes 用 namespace（#250 参照）
                - name: TARGET_NAMESPACES
                  value: |
                    kigawa-net-keruta-dev
                    kigawa-net-keruta-main
                    kigawa-net-keruta-stg
                    kigawa-net-keruta-beta
                    kigawa-net-lp-main
                    develop
                    prometheus
                    kigawa-net-mamoru-main
                    onemc-rpgcore
                    onemc-rpgcore-stg
                    onemc-rpgcore-dev
                    onemc-build
                    kigawa-net-el4s-realtime
                    platform-lipl-stg
                    platform-lipl-main
                    platform-exkes-stg
                    platform-exkes-main
                    kaft-stg
                    kaft-main
                    fusha-task-dev
                    fusha-task-stg
                    shifutomo-dev
                    shifutomo-stg
                    kigawa-net-ai-scheduler-dev
                    kigawa-net-ai-scheduler-stg
                    mcp-discord
                    mcp-growi
                - name: DYNAMIC_NAMESPACE_PATTERNS
                  value: |
                    ^platform-lipl-dev-pr-[0-9]+$
                    ^kaft-dev-pr-[0-9]+$
                    ^onemc-rpgcore-pr-[0-9]+$
              image: bitnami/kubectl:latest
              command:
                - /bin/bash
                - -c
                - |
                  set -e

                  # Read username and password from source secret
                  USERNAME=$(kubectl get secret harbor-sec -o jsonpath='{.data.user}' | base64 -d)
                  PASSWORD=$(kubectl get secret harbor-sec -o jsonpath='{.data.pass}' | base64 -d)

                  sync_namespace() {
                    local namespace="$1"
                    # Create or update the harbor-registry secret with correct type
                    if ! kubectl create secret docker-registry harbor-registry \
                      --docker-server=harbor.kigawa.net \
                      --docker-username="$USERNAME" \
                      --docker-password="$PASSWORD" \
                      --dry-run=client -o yaml -n "$namespace" | kubectl apply -f -; then
                      echo "WARN: failed to sync harbor-registry to $namespace, skipping" >&2
                      return 0
                    fi

                    echo "Secret harbor-registry synced successfully at $(date) to $namespace"
                  }

                  echo "$TARGET_NAMESPACES" | while read -r namespace; do
                    if [[ -z "$namespace" ]]; then continue; fi
                    sync_namespace "$namespace"
                  done

                  # PRごとに動的生成されるnamespace（platform-lipl-dev-pr-<N> 等）を
                  # 実在するnamespace一覧から正規表現でマッチさせて同期する
                  all_namespaces=$(kubectl get namespaces -o jsonpath='{.items[*].metadata.name}')
                  echo "$DYNAMIC_NAMESPACE_PATTERNS" | while read -r pattern; do
                    if [[ -z "$pattern" ]]; then continue; fi
                    for namespace in $all_namespaces; do
                      if [[ "$namespace" =~ $pattern ]]; then
                        sync_namespace "$namespace"
                      fi
                    done
                  done
