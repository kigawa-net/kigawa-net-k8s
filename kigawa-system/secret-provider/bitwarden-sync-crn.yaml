apiVersion: batch/v1
kind: CronJob
metadata:
  name: bitwarden-sync-crn
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        spec:
          serviceAccountName: sec-sync-sa
          restartPolicy: OnFailure
          containers:
            - name: create-secret
              env:
                - name: TARGET_NAMESPACES
                  value: |
                    kigawa-net-keruta-dev
                    kigawa-net-keruta-main
                    kigawa-net-lp-main
                    kigawa-net-nextcloud
                    develop
                    kigawa-net-maas
                    kigawa-net-mc-ftb-mc
                    kigawa-net-llm
                    kigawa-net-llm-proxy
                    kigawa-net-llm-ui
                    keycloak
                    arc-runners
                    kigawa-net-sentry
                    kigawa-net-mamoru-main
                    mcp-discord
                    mcp-growi
                    argocd
                    onemc-rpgcore
                    onemc-rpgcore-stg
                    onemc-rpgcore-dev
                    onemc-build
                    kigawa-net-admin-panel
                    platform-lipl-stg
                    platform-lipl-main
                - name: DYNAMIC_NAMESPACE_PATTERNS
                  value: |
                    ^platform-lipl-dev-pr-[0-9]+$
              image: bitnami/kubectl:latest
              command:
                - /bin/bash
                - -c
                - |
                  set -e

                  token=$(kubectl get secret bitwarden-sec -o jsonpath='{.data.token}' | base64 -d)

                  sync_namespace() {
                    local namespace="$1"
                    if ! kubectl create secret generic bitwarden-sec \
                      --from-literal=token="$token" \
                      --dry-run=client -o yaml -n "$namespace" | kubectl apply -f -; then
                      echo "WARN: failed to sync bitwarden-sec to $namespace, skipping" >&2
                      return 0
                    fi

                    echo "Secret bitwarden-sec synced successfully at $(date) to $namespace"
                  }

                  echo "$TARGET_NAMESPACES" | while read -r namespace; do
                    if [[ -z "$namespace" ]]; then continue; fi
                    sync_namespace "$namespace"
                  done

                  # PRごとに動的生成されるnamespace（platform-lipl-dev-pr-<N> 等）を
                  # 実在するnamespace一覧から正規表現でマッチさせて同期する
                  all_namespaces=$(kubectl get namespaces -o jsonpath='{.items[*].metadata.name}')
                  echo "$DYNAMIC_NAMESPACE_PATTERNS" | while read -r pattern; do
                    if [[ -z "$pattern" ]]; then continue; fi
                    for namespace in $all_namespaces; do
                      if [[ "$namespace" =~ $pattern ]]; then
                        sync_namespace "$namespace"
                      fi
                    done
                  done
