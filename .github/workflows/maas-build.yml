# MAAS の Region のイメージだけをビルドする。Rack は k8s に載せず、control-plane のホスト(k8s2 / k8s4)に
# deb で直接インストールする(kigawa-net/infra#207)ため、Rack のイメージはビルドしない。
name: maas-build
on:
  push:
    branches:
      - main
    paths:
      - 'maas/docker/**'
  workflow_dispatch:

jobs:
  build-region:
    uses: ./.github/workflows/release.yml
    with:
      name: maas-region
      harborProject: library
      manifestFile: maas/region.yaml
      repository: kigawa-net/kigawa-net-k8s
      dockerFile: maas/docker/Dockerfile_region
      yamlPath: '.spec.template.spec.containers[0].image'
    secrets:
      HARBOR_PASS: ${{ secrets.HARBOR_PASS }}
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}