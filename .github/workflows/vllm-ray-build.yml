name: vllm-ray-build

on:
  push:
    branches:
      - main
    paths:
      - 'vllm/image/**'
      - '.github/workflows/vllm-ray-build.yml'
  workflow_dispatch:

jobs:
  build-vllm-ray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.kigawa.net
          username: robot$kigawa-net
          password: ${{ secrets.HARBOR_PASS }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: vllm/image/Dockerfile
          load: true
          tags: harbor.kigawa.net/library/vllm-ray:v0.23.0-ray2.37.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          docker run --rm --entrypoint bash harbor.kigawa.net/library/vllm-ray:v0.23.0-ray2.37.0 -lc '
            set -e
            ray --version
            python -c "import ray; print(ray.__version__)"
            vllm --version
          '

      - name: Push image to Harbor
        run: docker push harbor.kigawa.net/library/vllm-ray:v0.23.0-ray2.37.0
