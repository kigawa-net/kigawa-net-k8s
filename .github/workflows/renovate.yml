name: renovate

on:
  schedule:
    - cron: '0 3 * * 1' # 毎週月曜 03:00 UTC (12:00 JST)
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46
        with:
          configurationFile: renovate.json
          token: '${{ secrets.GIT_TOKEN }}'
