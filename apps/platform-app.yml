apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/kigawa-net/platform.git
    targetRevision: main
    path: apps
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Project for kigawa.net platform repository resources

  # ----------------------------
  # デプロイ先の制限
  # ----------------------------
  destinations:
    - name: in-cluster
      server: https://kubernetes.default.svc
      namespace: platform-*

  # ----------------------------
  # 許可する Git リポジトリ
  # ----------------------------
  sourceRepos:
    - https://github.com/kigawa-net/*

  # ----------------------------
  # Namespace リソース許可
  # ----------------------------
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # ----------------------------
  # Cluster スコープ リソース許可
  # （IngressClass, CRD, ClusterRole など）
  # ----------------------------
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
