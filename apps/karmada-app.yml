apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karmada
  namespace: argocd
spec:
  project: default

  source:
    # 公式Karmada Helmチャート(v1.19.0)をvendoringした静的マニフェスト。
    # 理由: 生のHelmチャートを直接ArgoCDでsyncすると2つの問題がある。
    #   1. ArgoCDの既知バグ(argoproj/argo-cd#12936): PreSync hookリソースが
    #      ServerSideApply=true/Replace=trueいずれのsyncOptionsも尊重されず、
    #      KarmadaのCRD用ConfigMap(karmada-crds-policy-bases等、262144バイト超)が
    #      "metadata.annotations: Too long"で常に失敗する。
    #   2. チャートにhelm.sh/hook: post-deleteが付与されたJob(karmada-post-delete)が
    #      含まれており、Helmのフックセマンティクスを持たないツール(kubectl apply等)
    #      で適用すると「helm uninstall時のみ実行されるべき削除処理」が即座に実行され、
    #      karmada-systemのリソースを丸ごと削除してしまう。
    # このvendored manifest(karmada/manifest.yaml)は、公式チャートをレンダリングした上で
    #   - karmada-post-delete Jobを除外(上記2の回避)
    #   - 全リソースからhelm.sh/hook*アノテーションを除去(hookではない通常リソースとして
    #     syncOptionsが正しく適用されるようにするため。上記1の回避)
    #   - etcd StatefulSetのvolumeClaimTemplates storageサイズが空でレンダリングされる
    #     チャート/レンダリング側の不具合を10Giに修正
    # した結果を静的YAMLとしてコミットしたもの。
    # チャートバージョンを上げる場合は同様の手順(レンダリング→post-delete除外→
    # hookアノテーション除去→PVCサイズ確認)でこのファイルを再生成すること。
    repoURL: https://github.com/kigawa-net/kigawa-net-k8s.git
    targetRevision: HEAD
    path: karmada

  destination:
    server: https://kubernetes.default.svc
    namespace: karmada-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # ignoreDifferencesは「差分とみなさない(sync要否の判定・ステータス表示)」
      # だけで、実際のsync実行時には対象から除外されない。ApplyOutOfSyncOnly=true
      # を付けて初めて、ignoreDifferences済みで実質Synced扱いのリソースが
      # sync操作の適用対象から実際にスキップされる。これが無いと、他のリソース
      # の変更を含む同期のたびにkarmada-crds-patches/karmada-static-resources
      # のdataが未置換内容へ巻き戻される(実際に発生・確認済み)。
      - ApplyOutOfSyncOnly=true

  # karmada-crds-patches / karmada-static-resources は、静的マニフェスト上は
  # ca_crtプレースホルダー({{ ca_crt }})を含んだ未置換状態でコミットされている。
  # 実際の置換は karmada-pre-upgrade Jobが実行時にkarmada-cert Secretから
  # 生成済みCAを読み取ってsedで書き換え、kubectl applyし直すことで行われる
  # (Helm本来のpre-upgrade hookの役割)。
  # pre-upgrade Jobは一度Completeすると同じ内容では再実行されないため、ArgoCDの
  # syncがこの2つのConfigMapを毎回git上の(未置換の)内容に巻き戻してしまうと、
  # karmada-static-resource Jobがkustomizeの"wrong node kind"エラーで
  # 恒久的に失敗し続ける(実際に発生・確認済み)。
  # このためArgoCDにこの2つのConfigMapのdataフィールドの差分を無視させ、
  # 一度Job側が置換した内容を上書きしないようにする。
  ignoreDifferences:
    - kind: ConfigMap
      name: karmada-crds-patches
      jsonPointers:
        - /data
    - kind: ConfigMap
      name: karmada-static-resources
      jsonPointers:
        - /data
