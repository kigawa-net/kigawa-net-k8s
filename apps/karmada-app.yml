apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karmada
  namespace: argocd
spec:
  project: default

  source:
    # 公式 Karmada Helm リポジトリ (karmada-io/karmada の charts/ を raw.githubusercontent.com 経由で公開)
    repoURL: https://raw.githubusercontent.com/karmada-io/karmada/master/charts
    chart: karmada
    targetRevision: v1.19.0
    helm:
      releaseName: karmada
      valuesObject:
        etcd:
          # mode: internal (チャートデフォルト) を明示。self-managed etcdをMVPとして採用し、
          # 外部3ノードetcdへの移行は別タスクとする。
          mode: internal
          internal:
            # 単一レプリカ・PVC永続化 (MVP)。デフォルトは hostPath のため rook-ceph-rbd の PVC に変更。
            replicaCount: 1
            storageType: pvc
            pvc:
              storageClass: rook-ceph-rbd
              size: 10Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: karmada-system

  syncPolicy:
    # automated sync(prune含む)は一時的に無効化している。ArgoCDの既知バグ
    # (argoproj/argo-cd#12936: PreSync hookがServerSideApply/Replace両方の
    # syncOptionsを尊重しない)により、KarmadaのCRD用ConfigMapが常にPreSync
    # 段階で "metadata.annotations: Too long" エラーで失敗する。この状態で
    # automated+prune=trueを有効にしたままだと、手動で
    # `kubectl apply --server-side` によりブートストラップした
    # karmada-systemのリソース(Deployment/StatefulSet/Job/Namespace自体)を、
    # ArgoCDの定期リコンサイル(prune=true)が数十秒〜数分単位で丸ごと
    # 削除してしまう(実際に2回発生・確認済み)。上流バグが解消されるか
    # 別の回避策が見つかるまで、このApplicationは手動同期のみで運用する。
    syncOptions:
      - CreateNamespace=true
      # KarmadaのCRD群を含むConfigMap(karmada-crds-policy-bases等)が大きく、
      # クライアントサイドapplyのlast-applied-configurationアノテーション上限
      # (262144バイト)を超えて "metadata.annotations: Too long" で失敗する。
      # ServerSideApply=trueのみでは解消しなかったため(PreSync hookリソースの
      # 適用経路がsyncOptionsを完全には踏襲していない可能性)、エラーメッセージが
      # 提案するもう一方の回避策であるReplace=true(kubectl replace相当、
      # アノテーションを介さない)も併用する。
      - ServerSideApply=true
      - Replace=true
