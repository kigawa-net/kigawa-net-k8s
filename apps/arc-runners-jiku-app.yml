apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners-jiku
  namespace: argocd
spec:
  project: kigawa-net

  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.2
    helm:
      releaseName: arc-runner-set-jiku
      valuesObject:
        githubConfigUrl: "https://github.com/binary-youchien/2026-Team-34"
        githubConfigSecret: arc-github-secret-jiku
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-gha-rs-controller
        containerMode:
          type: dind
        minRunners: 0
        maxRunners: 5
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: NotIn
                          values:
                            - k8s-worker3
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:2.336.0
                imagePullPolicy: IfNotPresent
                command: ["/home/runner/run.sh"]
                # 他のrunner-set(kigawa01/onemc/infra)はlimits.memory: 8Giだが、jikuの
                # deploy-frontend.yml「Test」ステップ(testAndroidHostTest+jsTest+wasmJsTest)は
                # Gradleデーモン(4096M)+Kotlinデーモン(3072M)+Node.js+ヘッドレスChromeを
                # 同時に抱え、8Giでは頻繁にコンテナのメモリ上限でプロセスがOOM Killされていた
                # (2026-08-21〜22、mainのDeploy Frontend (Pages)が4回連続で
                # 「Cannot find node module kotlin-web-helpers/...」で失敗。OutOfMemoryErrorの
                # 文字列はログに出ないが、npm/nodeプロセスがカーネルのOOM killerでSIGKILLされ
                # インストールが不完全になった結果と一致する)。そのため16Giに増設している
                resources:
                  requests:
                    memory: "4Gi"
                    cpu: "2"
                    ephemeral-storage: "30Gi"
                  limits:
                    memory: "16Gi"
                    cpu: "4"
                volumeMounts:
                  - name: gradle-home
                    mountPath: /home/runner/.gradle
            volumes:
              - name: gradle-home
                emptyDir: {}

  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners

  syncPolicy:
    automated:
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
