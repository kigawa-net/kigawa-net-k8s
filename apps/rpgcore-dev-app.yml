apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onemc-rpgcore-dev
  namespace: argocd
spec:
  project: one

  source:
    repoURL: https://github.com/OneServerMC/k8s.git
    targetRevision: main
    path: manifest/rpgcore/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: onemc-rpgcore-dev

  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
