apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onemc-rpgcore-dev
  namespace: argocd
spec:
  project: one

  source:
    repoURL: https://github.com/OneServerMC/infra.git
    targetRevision: main
    path: overlays/dev-velocity
    kustomize:
      # overlays/dev-velocityの土台であるoverlays/devはRpgCoreのPR
      # プレビュー環境(rpgcore-pr-preview ApplicationSet)とも共有
      # しているテンプレートのため、コールドスタート(mc-routerの
      # auto-scale-up/down)はデフォルトで有効になる。この常設dev
      # 環境だけは明示的にオプトアウトする。
      commonAnnotations:
        mc-router.itzg.me/autoScaleUp: "false"
        mc-router.itzg.me/autoScaleDown: "false"

  destination:
    server: https://kubernetes.default.svc
    namespace: onemc-rpgcore-dev

  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
