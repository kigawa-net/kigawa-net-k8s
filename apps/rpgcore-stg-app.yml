apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onemc-rpgcore-stg-plugin
  namespace: argocd
spec:
  project: one

  source:
    repoURL: https://github.com/OneServerMC/infra.git
    targetRevision: main
    path: overlays/stg
    kustomize:
      # 常設環境なのでmc-routerのコールドスタート(auto-scale-up/down)
      # は無効化する(有効なのはRpgCoreのPRプレビュー環境のみ)。
      commonAnnotations:
        mc-router.itzg.me/autoScaleUp: "false"
        mc-router.itzg.me/autoScaleDown: "false"

  destination:
    server: https://kubernetes.default.svc
    namespace: onemc-rpgcore-stg

  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
