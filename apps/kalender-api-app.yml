apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kigawa-net-kalender-api
  namespace: argocd
spec:
  project: kigawa-net

  source:
    repoURL: https://github.com/kigawa-net/kalender.git
    targetRevision: master
    path: k8s/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: kigawa-net-kalender

  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
