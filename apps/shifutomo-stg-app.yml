apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shifutomo-stg
  namespace: argocd
spec:
  project: project-fusha

  source:
    repoURL: https://github.com/project-fusha/platform.git
    targetRevision: main
    path: shifutomo/overlays/stg

  destination:
    server: https://kubernetes.default.svc
    namespace: shifutomo-stg

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
