apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rpgcore-pr-preview
  namespace: argocd
spec:
  generators:
    - pullRequest:
        github:
          owner: OneServerMC
          repo: RpgCore
          appSecretName: rpgcore-pr-github-app
        requeueAfterSeconds: 60
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  template:
    metadata:
      name: 'rpgcore-pr-{{.number}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: one
      source:
        repoURL: https://github.com/OneServerMC/infra.git
        targetRevision: main
        path: overlays/dev
        kustomize:
          namespace: 'onemc-rpgcore-pr-{{.number}}'
          images:
            - 'harbor.kigawa.net/private/rpgcore:pr-{{.number}}'
        # PR環境へのmc-router経由の直接接続(pr-{{.number}}.onemc.world)は廃止した。
        # dev.onemc.worldに接続後、Velocityの/serverコマンドでpr-{{.number}}へ
        # 移動する経路に一本化する(OneServerMC/velocity-pr-discovery)。
        # mc-routerとVelocityが同じDeploymentを別々の基準でauto-scaleすると
        # 競合するため、経路を1つに絞る。
      destination:
        server: https://kubernetes.default.svc
        namespace: 'onemc-rpgcore-pr-{{.number}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
