apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bitwarden-sm-operator
  namespace: argocd
spec:
  project: default

  source:
    # Bitwarden Secrets Manager Operator
    repoURL: https://charts.bitwarden.com
    chart: sm-operator
    targetRevision: "1.1.0"
    helm:
      values: |
        # Sync 間隔（秒）最小値: 180
        settings:
          bwSecretsManagerRefreshInterval: 300
          cloudRegion: US
          # セルフホストの場合は以下を設定
          # bwApiUrlOverride: "https://your-bitwarden.example.com/api"
          # bwIdentityUrlOverride: "https://your-bitwarden.example.com/identity"
        # chart 既定の memory limit 128Mi では BitwardenSecret 約 100 件の同期で
        # OOMKilled を繰り返し（再起動 566 回を確認）、Secret が空のまま残る
        # （mariadb-exkes-stg の pass 欠落など）ため引き上げる。
        containers:
          manager:
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 10m
                memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: sm-operator-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
