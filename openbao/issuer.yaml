apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-issuer
  namespace: kigawa-net-openbao
spec:
  acme:
    email: letsencrypt@kigawa.net
    privateKeySecretRef:
      name: openbao-issuer
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              key: api-token
              name: cloudflare-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bao01-tls
  namespace: kigawa-net-openbao
spec:
  secretName: bao01-tls
  dnsNames:
    - bao01.kigawa.net
  issuerRef:
    name: openbao-issuer
    kind: Issuer
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
