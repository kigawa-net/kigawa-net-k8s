# API(8200)だけを VIP 10.0.0.245(MetalLB の L2)で公開する(Inuyama の LAN から、Unseal や運用に使う)。
# Raft(8201)は、Pod の EasyTier(オーバーレイ 10.250.0.30)で行うので、公開しない。
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: kigawa-net-openbao
  annotations:
    metallb.universe.tf/loadBalancerIPs: 10.0.0.245
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: openbao
  ports:
    - name: api
      port: 8200
      targetPort: 8200
---
# StatefulSet 用(Pod の安定した名前)
apiVersion: v1
kind: Service
metadata:
  name: openbao-headless
  namespace: kigawa-net-openbao
spec:
  clusterIP: None
  selector:
    app: openbao
  ports:
    - name: api
      port: 8200
    - name: cluster
      port: 8201
