apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-deployment
  namespace: kigawa-net-llm
  labels:
    app: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.23.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec python3 -m vllm.entrypoints.openai.api_server \
                --model QuantTrio/Qwen3-Coder-30B-A3B-Instruct-AWQ \
                --served-model-name production-llm \
                --quantization awq_marlin \
                --tensor-parallel-size 2 \
                --disable-custom-all-reduce \
                --max-model-len 32768 \
                --gpu-memory-utilization 0.92 \
                --dtype float16 \
                --trust-remote-code \
                --max-num-seqs 8 \
                --enable-auto-tool-choice \
                --tool-call-parser qwen3_coder \
                --port 8000 \
                --host 0.0.0.0
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm
                  key: api-key
            - name: TMPDIR
              value: /vllm-tmp
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            # 2 枚目の 3060 は PCIe x4(チップセット経由)で、GeForce は P2P 非対応。
            # P2P を使おうとして止まらないよう無効化する(通信はホストメモリ経由)
            - name: NCCL_P2P_DISABLE
              value: "1"
          resources:
            requests:
              nvidia.com/gpu: "2"
              cpu: "2"
              memory: "6Gi"
              ephemeral-storage: "1Gi"
            limits:
              nvidia.com/gpu: "2"
              cpu: "6"
              memory: "18Gi"
              ephemeral-storage: "10Gi"
          volumeMounts:
            - mountPath: /root/.cache/huggingface
              name: hf-cache
            - mountPath: /vllm-tmp
              name: vllm-tmp
            # tensor parallel のワーカー間通信(NCCL / 共有メモリ)用
            - mountPath: /dev/shm
              name: dshm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 120
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      runtimeClassName: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["k8s-worker5"]
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache-pvc
        - name: vllm-tmp
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
