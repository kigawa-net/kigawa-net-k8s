apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-deployment
  namespace: kigawa-net-llm
  labels:
    app: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          # vLLM から llama.cpp(CUDA)に載せ替えた。Deployment / Service / ラベルの名前は、
          # LiteLLM・Ingress が参照しているため vllm のまま変えない
          image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12199
          args:
            # Qwen3.8-27B(dense)。UD-Q4_K_M で RTX 3060 x2(計 24GB)に載せる。
            # 初回はここからダウンロードして PVC にキャッシュする
            - -hf
            - unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M
            - --no-mmproj
            # LiteLLM が参照するモデル名
            - --alias
            - production-llm
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            # 全層を GPU に載せ、2 枚へ層ごとに均等分割(2 枚目は PCIe x4 のため、層分割にする)
            - -ngl
            - "99"
            - --split-mode
            - layer
            - --tensor-split
            - "1,1"
            - -fa
            - "on"
            # 64k トークンの KV を 1 スロットで使う(KV は q8_0 で量子化)
            - -c
            - "65536"
            - -np
            - "1"
            - --kv-unified
            - -ctk
            - q8_0
            - -ctv
            - q8_0
            - --jinja
            # 思考出力を止める。思考あり(on)だと、1 件の生成が平均約 100 秒(最大約 330 秒、思考の分を含めて最大 4096 トークン)かかり、
            # スループットが約 0.4 件/分に落ちて、順番待ちが 30 分を超えてタイムアウトする(2026-11-15 の実測)。
            # off にすると、生成が数分の 1 になる見込み(1 件の平均が約 127 秒 → 約 40〜50 秒)。品質を優先して、思考が要るときは on に戻す
            - --reasoning
            - "off"
            - --cache-reuse
            - "256"
            # プロンプト処理(prefill)の物理バッチを 512(既定)から 1024 に。プロンプトの中央値が約 2.7 万トークンで、
            # prefill が 1 件の約半分を占める(約 870 tok/s)。VRAM の空きは合計約 5.8GB(GPU0 3.4GB、GPU1 2.4GB)
            - -ub
            - "1024"
            # MTP(Multi-Token Prediction)による投機的デコード。モデルの GGUF に MTP の層(blk.64.nextn.*)が入っているが、
            # これまでは使われていなかった(起動ログ: "model has unused tensor blk.64.nextn.eh_proj.weight -- ignoring")。
            # 別の draft モデルは不要。確認(検証)を通ったトークンだけを採用するので、出力の品質は変わらない。
            # 受け入れ率が低いと、利益が小さくなるだけ。品質への影響を疑うときは、この 2 行を外す
            - --spec-type
            - draft-mtp
            - --spec-draft-n-max
            - "2"
            - --no-webui
            - --metrics
          ports:
            - containerPort: 8000
              name: http
          env:
            # API キーは vLLM と同じ Secret(LiteLLM が同じ値で呼ぶ)
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm
                  key: api-key
            - name: LLAMA_CACHE
              value: /root/.cache/huggingface/llama.cpp
          resources:
            requests:
              nvidia.com/gpu: "2"
              cpu: "2"
              memory: "6Gi"
              ephemeral-storage: "1Gi"
            limits:
              nvidia.com/gpu: "2"
              cpu: "6"
              memory: "18Gi"
              ephemeral-storage: "10Gi"
          volumeMounts:
            - mountPath: /root/.cache/huggingface
              name: hf-cache
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 120
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      runtimeClassName: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["k8s-worker5"]
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache-pvc
