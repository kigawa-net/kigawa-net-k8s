apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-deployment
  namespace: kigawa-net-llm
  labels:
    app: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.33.0
          args:
            - --model
            - TelperionAI/Qwen3.8-27B-INT4-AWQ-GPTQ
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --tensor-parallel-size
            - "2"
            - --max-model-len
            - "60000"
            - --max-num-batched-tokens
            - "8192"
            - --gpu-memory-utilization
            - "0.92"
            - --max-num-seqs
            - "1"
            - --kv-cache-dtype
            - fp8
            - --served-model-name
            - production-llm
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_coder
            - --trust-remote-code
            - --enable-prefix-caching
            - --disable-custom-all-reduce
            - --reasoning-parser
            - qwen3
          ports:
            - containerPort: 8000
              name: http
          env:
            # API キーは LiteLLM と共有する Secret から取得する
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm
                  key: api-key
            - name: NCCL_P2P_DISABLE
              value: "1"
            - name: NCCL_IB_DISABLE
              value: "1"
            - name: HF_HOME
              value: /root/.cache/huggingface
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              nvidia.com/gpu: "2"
              cpu: "2"
              memory: "8Gi"
              ephemeral-storage: "1Gi"
            limits:
              nvidia.com/gpu: "2"
              cpu: "6"
              memory: "20Gi"
              ephemeral-storage: "10Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 120
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      runtimeClassName: nvidia
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["k8s-worker5"]
