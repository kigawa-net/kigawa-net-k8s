apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-serve
  namespace: kigawa-net-llm
  labels:
    app: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["k8s-worker5"]
      containers:
        - name: vllm
          image: harbor.kigawa.net/library/vllm-ray:v0.23.0-ray2.37.0
          command: ["sh", "-c"]
          args:
            - "exec vllm serve RedHatAI/Qwen3.8-27B-INT4 --served-model-name production-llm --tensor-parallel-size 2 --max-model-len 61440 --gpu-memory-utilization 0.92 --language-model-only --max-num-seqs 1 --max-num-batched-tokens 512 --kv-cache-dtype fp8 --trust-remote-code --port 8000 --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3 --enable-prefix-caching --async-scheduling --default-chat-template-kwargs '{\"enable_thinking\": false}'"
          env:
            - name: NCCL_IB_DISABLE
              value: "1"
            - name: NCCL_SOCKET_IFNAME
              value: eth0
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "2"
            limits:
              cpu: "4"
              memory: 24Gi
              nvidia.com/gpu: "2"
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /root/.cache/huggingface
              name: hf-cache
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 240
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache-pvc
