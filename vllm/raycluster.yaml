apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: vllm-cluster
  namespace: kigawa-net-llm
spec:
  suspend: false
  rayVersion: "2.37.0"
  headGroupSpec:
    serviceType: ClusterIP
    rayStartParams:
      num-cpus: "2"
      num-gpus: "0"
      dashboard-host: "0.0.0.0"
    template:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: ["k8s-worker3"]
        containers:
          - name: ray-head
            image: harbor.kigawa.net/library/vllm-ray:v0.23.0-ray2.37.0
            resources:
              requests:
                cpu: "2"
                memory: 8Gi
              limits:
                cpu: "4"
                memory: 16Gi
            env:
              - name: NCCL_IB_DISABLE
                value: "1"
              - name: NCCL_SOCKET_IFNAME
                value: eth0
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
            volumeMounts:
              - mountPath: /root/.cache/huggingface
                name: hf-cache
        volumes:
          - name: hf-cache
            persistentVolumeClaim:
              claimName: hf-cache-pvc
  workerGroupSpecs:
    - groupName: gpu-worker5
      replicas: 1
      minReplicas: 1
      maxReplicas: 1
      rayStartParams:
        num-gpus: "2"
      template:
        spec:
          runtimeClassName: nvidia
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["k8s-worker5"]
          containers:
            - name: ray-worker
              image: harbor.kigawa.net/library/vllm-ray:v0.23.0-ray2.37.0
              resources:
                requests:
                  cpu: "2"
                  memory: 4Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
              env:
                - name: NCCL_IB_DISABLE
                  value: "1"
                - name: NCCL_SOCKET_IFNAME
                  value: eth0
              volumeMounts:
                - mountPath: /root/.cache/huggingface
                  name: hf-cache
          volumes:
            - name: hf-cache
              persistentVolumeClaim:
                claimName: hf-cache-pvc
    - groupName: gpu-worker3
      replicas: 1
      minReplicas: 1
      maxReplicas: 1
      rayStartParams:
        num-gpus: "1"
      template:
        spec:
          runtimeClassName: nvidia
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["k8s-worker3"]
          containers:
            - name: ray-worker
              image: harbor.kigawa.net/library/vllm-ray:v0.23.0-ray2.37.0
              resources:
                requests:
                  cpu: "2"
                  memory: 4Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
              env:
                - name: NCCL_IB_DISABLE
                  value: "1"
                - name: NCCL_SOCKET_IFNAME
                  value: eth0
              volumeMounts:
                - mountPath: /root/.cache/huggingface
                  name: hf-cache
          volumes:
            - name: hf-cache
              persistentVolumeClaim:
                claimName: hf-cache-pvc
