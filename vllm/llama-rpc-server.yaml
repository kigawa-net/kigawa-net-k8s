# llama.cpp RPC Phase 1 検証(一時): worker3 の GPU x1 を RPC バックエンドとして公開する。
# 検証後はこのファイルごと revert して削除すること。
# 注意: rpc-server は認証・暗号化なし。ClusterIP のみで公開し、Ingress は作らない。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-rpc-server
  namespace: kigawa-net-llm
  labels:
    app: llama-rpc-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-rpc-server
  template:
    metadata:
      labels:
        # Service vllm-openai-service は app: vllm を選択するので、別ラベルにする
        app: llama-rpc-server
    spec:
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["k8s-worker3"]
      containers:
        - name: rpc-server
          image: harbor.kigawa.net/library/llama-cpp-rpc:b12199-cuda12.4
          command: ["rpc-server"]
          args:
            - --host
            - 0.0.0.0
            - --port
            - "50052"
          ports:
            - containerPort: 50052
              name: rpc
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "1"
          # RPC 転送中は新規接続がタイムアウトするため、再起動を伴わない readiness のみ使う。
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: llama-rpc-server
  namespace: kigawa-net-llm
  labels:
    app: llama-rpc-server
spec:
  ports:
    - name: rpc
      port: 50052
      targetPort: 50052
      protocol: TCP
  selector:
    app: llama-rpc-server
  type: ClusterIP
