# egress プロキシの非秘密の設定(agent-runtime/proxy/config.go の KIVRA_PROXY_*)。値の意味は kivra の agent-runtime/README.md。
# WIF の 4 つの ID は、PC 上の proxy が使っているもの(/etc/kivra-agent/proxy.env)と同じ。秘密ではない。
# federation rule は Keycloak の JWT 用(kivra 本体が使う k8s の ServiceAccount トークン用のルールとは別)。
# 許可リスト(許可するホスト)はイメージに焼かれている(/etc/kivra-agent-proxy/allowlist.txt。ここでは上書きしない)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: kivra-agent-proxy-cm
  namespace: kigawa-net-kivra-dev-agent
data:
  KIVRA_PROXY_LISTEN: ":8080"
  KIVRA_PROXY_AUTH: "wif"
  KIVRA_PROXY_KEYCLOAK_TOKEN_URL: "https://user.kigawa.net/realms/kigawa-net/protocol/openid-connect/token"
  KIVRA_PROXY_KEYCLOAK_CLIENT_ID: "kivra-agent"
  KIVRA_PROXY_KEYCLOAK_CLIENT_SECRET_FILE: "/run/secrets/keycloak_client_secret"
  # split-horizon DNS で user.kigawa.net が社内 LB(10.0.0.240)に解決されるための例外。WIF の Keycloak 取得だけに効く(CONNECT には効かない)。
  KIVRA_PROXY_KEYCLOAK_ALLOWED_IP: "10.0.0.240"
  KIVRA_PROXY_ANTHROPIC_TOKEN_URL: "https://api.anthropic.com/v1/oauth/token"
  KIVRA_PROXY_WIF_FEDERATION_RULE_ID: "fdrl_01FacAS74rvTgALAAffyQDAT"
  KIVRA_PROXY_WIF_ORGANIZATION_ID: "e1c1d300-e0a4-440c-badb-98548fdf42dc"
  KIVRA_PROXY_WIF_SERVICE_ACCOUNT_ID: "svac_01Ag9ow3Eu98GtMvLs2JCtUx"
  KIVRA_PROXY_WIF_WORKSPACE_ID: "wrkspc_01E6uq7ZNqUrt7p9oyiJgPVL"
