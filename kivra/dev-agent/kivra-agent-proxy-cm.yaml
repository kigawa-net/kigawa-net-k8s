# egress プロキシの非秘密の設定(agent-runtime/proxy/config.go の KIVRA_PROXY_*)。値の意味は kivra の agent-runtime/README.md。
# 空の 3 つ(WIF の ID)は、Anthropic Console の WIF 設定で発行された値を、有効化の前に記入する(秘密ではない)。
# 空のままだとプロキシは起動時に「missing environment variables」で終了する(安全側の失敗)。
# 許可リスト(許可するホスト)はイメージに焼かれている(/etc/kivra-agent-proxy/allowlist.txt。ここでは上書きしない)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: kivra-agent-proxy-cm
  namespace: kigawa-net-kivra-dev-agent
data:
  KIVRA_PROXY_LISTEN: ":8080"
  KIVRA_PROXY_AUTH: "wif"
  KIVRA_PROXY_KEYCLOAK_TOKEN_URL: "https://user.kigawa.net/realms/kigawa-net/protocol/openid-connect/token"
  KIVRA_PROXY_KEYCLOAK_CLIENT_ID: "kivra-agent"
  KIVRA_PROXY_KEYCLOAK_CLIENT_SECRET_FILE: "/run/secrets/keycloak_client_secret"
  KIVRA_PROXY_ANTHROPIC_TOKEN_URL: "https://api.anthropic.com/v1/oauth/token"
  KIVRA_PROXY_WIF_FEDERATION_RULE_ID: ""
  KIVRA_PROXY_WIF_ORGANIZATION_ID: ""
  KIVRA_PROXY_WIF_SERVICE_ACCOUNT_ID: ""
  KIVRA_PROXY_WIF_WORKSPACE_ID: ""
