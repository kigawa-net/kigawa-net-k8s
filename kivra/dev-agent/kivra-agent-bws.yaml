# kivra-agent 本体の Keycloak client secret(kivra の /api/agent/ を呼ぶための client credentials)。kivra 本体と同じ namespace に置く。
# 値は git に置かない。bws に client のシークレットを作り、その ID を下の bwSecretId に書く(0 の UUID はプレースホルダ)。
# 本体とプロキシで Keycloak の client を分けるかは ADR 0010 追補 7 §6 の未決の点。分けるなら別の client の secret にする。
# bitwarden-sec は kigawa-net-kivra-dev に既にある。
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: kivra-agent-client
  namespace: kigawa-net-kivra-dev
spec:
  organizationId: "a2b57f3d-6e2b-4467-b499-b31e00bfd804"
  secretName: kivra-agent-client
  authToken:
    secretName: bitwarden-sec
    secretKey: token
  map:
    - bwSecretId: "00000000-0000-0000-0000-000000000000" # TODO: プレースホルダ。実際の bws の ID に置き換える
      secretKeyName: client-secret
