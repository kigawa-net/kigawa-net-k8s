# kivra-agent 本体を in-cluster で動かす Deployment(Job を作る側)。ADR 0010 追補 7。
# k8s バックエンド(KIVRA_AGENT_BACKEND=k8s)で、claim した attempt を Run ごとの Job として実行する(PR 5c = kivra#539 で有効化できるようになった)。
# 止めるとき(キルスイッチ): replicas を 0 に戻す。または /work/STOP を作る。kivra 側の KIVRA_AGENT_API_ENABLED を外してもよい。
# 1 台だけ動かす(Recreate)。agent は二重起動を検出して終了コード 3 で終わる(restartPolicy は Always だが再起動ループになるので、RollingUpdate にしない)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kivra-agent
  namespace: kigawa-net-kivra-dev
  labels:
    app: kivra-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kivra-agent
  template:
    metadata:
      labels:
        app: kivra-agent
    spec:
      serviceAccountName: kivra-agent
      automountServiceAccountToken: true # HttpKubeApi.inCluster が SA の token と CA を使う
      imagePullSecrets:
        - name: harbor-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # kivra-agent/Dockerfile の USER 10001:10001
        runAsGroup: 10001
        fsGroup: 10001 # Secret のファイル(0440)をグループで読む
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kivra-agent
          image: harbor.kigawa.net/library/kivra-agent:main-e03d28b4e023a30ed8b22cab1b51ef80f1b1724b
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: KIVRA_AGENT_BACKEND
              value: "k8s"
            # Job を作る namespace(PodSecurity restricted、default-deny + プロキシだけの egress。agent の RBAC はこの namespace の Role だけ)。
            - name: KIVRA_AGENT_K8S_NAMESPACE
              value: "kigawa-net-kivra-dev-agent"
            # Job の Pod のイメージ(許可は 1 件)。CI(cd.yml の build-agent)が push する kivra-agent-runtime。タグは agent と同じコミットに合わせる。
            - name: KIVRA_AGENT_K8S_IMAGE
              value: "harbor.kigawa.net/library/kivra-agent-runtime:main-e03d28b4e023a30ed8b22cab1b51ef80f1b1724b"
            # Job の Pod の外向きの唯一の出口(egress プロキシ)。
            - name: KIVRA_AGENT_K8S_PROXY_URL
              value: "http://kivra-agent-proxy-svc.kigawa-net-kivra-dev-agent.svc:8080"
            # Pod が公開 GitHub から取得するリポジトリ(owner/repo)。
            - name: KIVRA_AGENT_REPO
              value: "kigawa-net/kivra"
            - name: KIVRA_AGENT_KIVRA_URL
              value: "https://kivra-dev.kigawa.net" # 公開の ingress 経由(/api/agent/ は kivra-agent-ingress)。kivra-netpol は本体の Pod への直接の経路を許さない
            - name: KIVRA_AGENT_TOKEN_URL
              value: "https://user.kigawa.net/realms/kigawa-net/protocol/openid-connect/token"
            - name: KIVRA_AGENT_CLIENT_ID
              value: "kivra-agent" # kivra 側の KIVRA_AGENT_AZP と同じ。ロール kivra-agent:agent。プロキシと同じ client(分けるかは ADR 追補 7 §6 の未決)
            - name: KIVRA_AGENT_CLIENT_SECRET_FILE
              value: "/var/run/kivra-agent/client-secret"
            - name: KIVRA_AGENT_WORK_DIR
              value: "/work"
            - name: KIVRA_AGENT_STOP_FILE
              value: "/work/STOP"
            - name: KIVRA_AGENT_EXECUTOR
              value: "real"
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx384m -XX:+UseG1GC -XX:+UseContainerSupport"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: client-secret
              mountPath: /var/run/kivra-agent
              readOnly: true
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: client-secret
          secret:
            secretName: kivra-agent-client
            defaultMode: 0440
        - name: work
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
