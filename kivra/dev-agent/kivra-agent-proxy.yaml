# egress プロキシ(agent-runtime/proxy)。k8s の Job の Pod の外向き通信の唯一の出口で、Anthropic への認証(WIF)も持つ。
# **replicas: 0 のまま入れる**(ArgoCD が適用しても Pod は 1 つも起動しない)。有効化は docs/README.md の手順 5 で、
# 実クラスタでの検証(手順 6)の前に replicas を 1 にする。
# image のタグは、kivra の CD(.github/workflows/cd.yml の matrix `kivra-agent-proxy`)が push する `<ブランチ>-<sha>` / `pr-<N>-<sha>`。
# 本体の kivra.yaml と違い、deploy-dev の自動更新の対象ではない(containers[0].image を yq で書き換えるのは kivra.yaml だけ)ので、手で固定する。
# ノード: NetworkPolicy が効くのは canal-cni=enabled のノードの Pod だけ(prod の CNI の切替が途中。flannel の Pod と canal の Pod は
# 通信できない)。Job の Pod と同じ側に置くため、requiredDuringScheduling で限定する。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kivra-agent-proxy
  namespace: kigawa-net-kivra-dev-agent
  labels:
    app: kivra-agent-proxy
spec:
  replicas: 0 # 有効化するとき 1 にする。プロキシは状態を持たないが、WIF のトークンのキャッシュは Pod ごと(1 で足りる)
  selector:
    matchLabels:
      app: kivra-agent-proxy
  template:
    metadata:
      labels:
        app: kivra-agent-proxy
    spec:
      serviceAccountName: kivra-agent-proxy
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry # 有効化の前に、この namespace に Secret harbor-registry が必要(docs/README.md)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: canal-cni
                    operator: In
                    values: ["enabled"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless の nonroot。Dockerfile は docker 用に root で動かす前提だが、k8s では非 root で動かす
        runAsGroup: 65532
        fsGroup: 65532 # Secret のファイル(0440)をグループで読む
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kivra-agent-proxy
          image: harbor.kigawa.net/library/kivra-agent-proxy:main-80158070cb0816c6b175b6c434d5a3a304e326b4 # TODO: Harbor に push 済みのタグか確認して固定する
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kivra-agent-proxy-cm
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi # docker 版(up-proxy.sh)の --memory 256m と同じ
          startupProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: client-secret
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: client-secret
          secret:
            secretName: kivra-agent-proxy-keycloak
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
