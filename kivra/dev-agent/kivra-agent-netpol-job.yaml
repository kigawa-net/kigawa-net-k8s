# Job の Pod(label kivra-agent=1)の egress は、プロキシ Service の Pod の 8080 と、DNS(kube-dns)だけ。ingress は無い(default-deny のまま)。
# NetworkPolicy は宛先を IP とポートでしか指定できない。プロキシの先(どのホストに出てよいか)は、プロキシの許可リストが決める。
# agent の exec / log は API server と kubelet 経由で Pod のネットワークを通らないので、ingress の許可は要らない。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kivra-agent-netpol-job
  namespace: kigawa-net-kivra-dev-agent
spec:
  podSelector:
    matchLabels:
      kivra-agent: "1"
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kivra-agent-proxy
      ports:
        - protocol: TCP
          port: 8080
    # この cluster の DNS は kube-system の CoreDNS(coredns/coredns-deployment.yaml、label k8s-app=kube-dns)。
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
