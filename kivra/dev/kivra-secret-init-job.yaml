apiVersion: batch/v1
kind: Job
metadata:
  name: kivra-secret-init-job
  annotations:
    # ServiceAccount/Role/RoleBinding(-2)の後、MariaDB・Deployment(0)の前に完了させる
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # ttlSecondsAfterFinished は付けない(削除されると ArgoCD が再作成するため)
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: kivra-secret-init
    spec:
      serviceAccountName: kivra-secret-init-sa
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secret-init
          image: alpine/k8s:1.31.4
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOME
              value: /tmp
            - name: KUBECACHEDIR
              value: /tmp/kube-cache
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Secret の存在確認。存在すれば 0、NotFound なら 1、それ以外の失敗は終了(作らない)
              # 既存の Secret は絶対に上書きしない(パスワード変更は MariaDB のデータと不整合になる)。値は標準出力・ログに出さない
              secret_exists() {
                if out=$(kubectl get secret "$1" -n "$POD_NAMESPACE" -o name 2>&1); then
                  return 0
                fi
                case "$out" in
                  *NotFound*|*"not found"*) return 1 ;;
                  *) echo "failed to check secret $1 (not NotFound)" >&2; exit 1 ;;
                esac
              }
              # kivra-db: 24 バイト乱数を base64 化(約 32 文字)
              if secret_exists kivra-db; then
                echo "secret kivra-db already exists; nothing to do"
              else
                root_pass=$(head -c 24 /dev/urandom | base64 | tr -d '\n')
                app_pass=$(head -c 24 /dev/urandom | base64 | tr -d '\n')
                kubectl create secret generic kivra-db -n "$POD_NAMESPACE" \
                  --from-literal=root-pass="$root_pass" \
                  --from-literal=pass="$app_pass" >/dev/null
                echo "secret kivra-db created"
              fi
              # kivra-oidc-cookie: oauth2-proxy の cookie secret(AES-256 用に 32 バイト。ちょうど 32 文字の英数字・記号)
              if secret_exists kivra-oidc-cookie; then
                echo "secret kivra-oidc-cookie already exists; nothing to do"
              else
                cookie_secret=$(head -c 32 /dev/urandom | base64 | tr -d '\n' | head -c 32)
                kubectl create secret generic kivra-oidc-cookie -n "$POD_NAMESPACE" \
                  --from-literal=cookie-secret="$cookie_secret" >/dev/null
                echo "secret kivra-oidc-cookie created"
              fi
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
