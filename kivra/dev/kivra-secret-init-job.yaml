apiVersion: batch/v1
kind: Job
metadata:
  name: kivra-secret-init-job
  annotations:
    # ServiceAccount/Role/RoleBinding(-2)の後、MariaDB・Deployment(0)の前に完了させる
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # ttlSecondsAfterFinished は付けない(削除されると ArgoCD が再作成するため)
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: kivra-secret-init
    spec:
      serviceAccountName: kivra-secret-init-sa
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secret-init
          image: alpine/k8s:1.31.4
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOME
              value: /tmp
            - name: KUBECACHEDIR
              value: /tmp/kube-cache
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # 既存の Secret は絶対に上書きしない(パスワード変更は MariaDB のデータと不整合になる)
              if out=$(kubectl get secret kivra-db -n "$POD_NAMESPACE" -o name 2>&1); then
                echo "secret kivra-db already exists; nothing to do"
                exit 0
              fi
              case "$out" in
                *NotFound*|*"not found"*) ;;
                *) echo "failed to check secret kivra-db (not NotFound)" >&2; exit 1 ;;
              esac
              # 24 バイト乱数を base64 化(約 32 文字)。値は標準出力・ログに出さない
              root_pass=$(head -c 24 /dev/urandom | base64 | tr -d '\n')
              app_pass=$(head -c 24 /dev/urandom | base64 | tr -d '\n')
              kubectl create secret generic kivra-db -n "$POD_NAMESPACE" \
                --from-literal=root-pass="$root_pass" \
                --from-literal=pass="$app_pass" >/dev/null
              echo "secret kivra-db created"
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
