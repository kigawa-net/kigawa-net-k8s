apiVersion: batch/v1
kind: Job
metadata:
  name: kivra-db-users-secret-init-job
  annotations:
    # ServiceAccount/Role/RoleBinding(-2)の後、MariaDB・Deployment(0)の前に完了させる
    # 既存の kivra-secret-init-job は Job の spec.template が immutable のため触らず、別 Job にした
    # (既存 Job を書き換えると ArgoCD の同期が "field is immutable" で失敗し、User/Grant が反映されなくなる)
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # ttlSecondsAfterFinished は付けない(削除されると ArgoCD が再作成するため)
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: kivra-db-users-secret-init
    spec:
      serviceAccountName: kivra-secret-init-sa
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secret-init
          image: alpine/k8s:1.31.4
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOME
              value: /tmp
            - name: KUBECACHEDIR
              value: /tmp/kube-cache
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Secret の存在確認。存在すれば 0、NotFound なら 1、それ以外の失敗は終了(作らない)
              # 既存の Secret は絶対に上書きしない(パスワード変更は MariaDB のデータと不整合になる)。値は標準出力・ログに出さない
              secret_exists() {
                if out=$(kubectl get secret "$1" -n "$POD_NAMESPACE" -o name 2>&1); then
                  return 0
                fi
                case "$out" in
                  *NotFound*|*"not found"*) return 1 ;;
                  *) echo "failed to check secret $1 (not NotFound)" >&2; exit 1 ;;
                esac
              }
              # kivra-db-migrator: Flyway migration 用ユーザー(kivra-migrator)のパスワード(24 バイト乱数を base64 化)
              if secret_exists kivra-db-migrator; then
                echo "secret kivra-db-migrator already exists; nothing to do"
              else
                migrator_pass=$(head -c 24 /dev/urandom | base64 | tr -d '\n')
                kubectl create secret generic kivra-db-migrator -n "$POD_NAMESPACE" \
                  --from-literal=pass="$migrator_pass" >/dev/null
                echo "secret kivra-db-migrator created"
              fi
              # kivra-db-backup: バックアップ・リストア試験用ユーザー(kivra-backup)のパスワード
              if secret_exists kivra-db-backup; then
                echo "secret kivra-db-backup already exists; nothing to do"
              else
                backup_pass=$(head -c 24 /dev/urandom | base64 | tr -d '\n')
                kubectl create secret generic kivra-db-backup -n "$POD_NAMESPACE" \
                  --from-literal=pass="$backup_pass" >/dev/null
                echo "secret kivra-db-backup created"
              fi
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
