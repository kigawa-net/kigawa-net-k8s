apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kivra-secret-init-role
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  # 既存の kivra-db Secret の存在確認のみ(名前で限定)
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kivra-db"]
    verbs: ["get"]
  # kivra-oidc-cookie の存在確認のみ(名前で限定)
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kivra-oidc-cookie"]
    verbs: ["get"]
  # 新しい DB ユーザー用 Secret の存在確認のみ(名前で限定)。get がないと secret_exists が Forbidden で失敗する
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kivra-db-migrator", "kivra-db-backup"]
    verbs: ["get"]
  # create は resourceNames で限定できない。Secret を上書きする verb(update/patch/delete)は付けない
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
