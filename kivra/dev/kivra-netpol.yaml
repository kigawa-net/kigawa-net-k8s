# CNI が NetworkPolicy に対応していない場合は無視される(害はない)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kivra-netpol
spec:
  podSelector:
    matchLabels:
      app: kivra
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 同じ namespace からのみ(ingress controller / kube-system は含めない)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # MariaDB(同 namespace の kivra-db)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: kivra-db
      ports:
        - protocol: TCP
          port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kivra-db-netpol
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kivra-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kivra
      ports:
        - protocol: TCP
          port: 3306
