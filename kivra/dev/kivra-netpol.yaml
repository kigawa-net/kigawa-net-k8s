# Limit ingress to the Kivra application to the authenticated oauth2-proxy Pod.
# A namespace-wide selector would let ANY Pod in kigawa-net-kivra-dev bypass
# Keycloak by connecting directly to the app's unauthenticated ClusterIP.
#
# This is defense-in-depth, NOT a substitute for application-layer AuthN/AuthZ.
# ServiceAccount privileges (including kubectl port-forward) and node-origin
# traffic are governed separately. Verify CNI enforcement in the live cluster.
#
# Egress and MariaDB ingress are intentionally deferred until actual DNS,
# MariaDB operator, and collector traffic identities are validated.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kivra-netpol
spec:
  podSelector:
    matchLabels:
      app: kivra
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kivra-oauth2-proxy
      ports:
        - protocol: TCP
          port: 8080
