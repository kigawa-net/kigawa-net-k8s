# kivra Pod への ingress を oauth2-proxy の Pod からのみに制限する(Task API が X-Auth-Request-* ヘッダーを信頼するため)。
# CNI が NetworkPolicy に対応していない場合は無視される(害はない)。
#
# 意図的に含めていないもの(クラスタで実際のラベル/接続元を確認してから段階的に追加する):
#  - kivra の egress 制限: DNS(独自の CoreDNS)と MariaDB のラベルが実際と違うと、kivra が起動できなくなる
#  - kivra-db の ingress 制限: MariaDB operator が別 namespace から DB に接続する場合、Database/User/Grant の反映が止まる
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kivra-netpol
spec:
  podSelector:
    matchLabels:
      app: kivra
  policyTypes:
    - Ingress
  ingress:
    # oauth2-proxy の Pod からのみ。kivra は X-Auth-Request-* ヘッダーを信頼する(Task API)ので、これ以外から到達できると
    # ヘッダーを偽装されて他人になりすませる。同じ namespace の他の Pod(MariaDB、Job など)からも到達させない。
    - from:
        - podSelector:
            matchLabels:
              app: kivra-oauth2-proxy
      ports:
        - protocol: TCP
          port: 8080
