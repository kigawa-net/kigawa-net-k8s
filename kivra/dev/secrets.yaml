# kivra dev の MariaDB 用パスワードを同期する BitwardenSecret。
#
# デプロイ前に必要な作業:
#   Bitwarden Secrets Manager にシークレットを 2 つ作成し、
#   下の bwSecretId の REPLACE_ME_... プレースホルダーを、作成したシークレットの ID に置換すること。
#     - root-pass: MariaDB の root パスワード
#     - pass:      アプリ用ユーザー kivra のパスワード
#   実際の秘密値はこのファイルに書かないこと。
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: kivra-db
spec:
  organizationId: "a2b57f3d-6e2b-4467-b499-b31e00bfd804"
  secretName: kivra-db
  authToken:
    secretName: bitwarden-sec
    secretKey: token
  map:
    - bwSecretId: "REPLACE_ME_kivra_dev_mariadb_root_password_bws_id"
      secretKeyName: root-pass
    - bwSecretId: "REPLACE_ME_kivra_dev_mariadb_app_password_bws_id"
      secretKeyName: pass
