apiVersion: apps/v1
kind: Deployment
metadata:
  name: kivra
  labels:
    app: kivra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kivra
  template:
    metadata:
      name: kivra
      labels:
        app: kivra
    spec:
      imagePullSecrets:
        - name: harbor-registry
      serviceAccountName: kivra
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: kivra
          image: harbor.kigawa.net/library/kivra:main-99539a66feda4557afd11caf08fb0303ee0ab19a
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          env:
            - name: KIVRA_DB_JDBC_URL
              value: "jdbc:mariadb://kivra-db:3306/kivra?sessionVariables=time_zone='+00:00'"
            - name: KIVRA_DB_USER
              value: "kivra"
            - name: KIVRA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kivra-db
                  key: pass
            # Flyway の migration 専用ユーザー(kivra-migrator、kivra.* の ALL PRIVILEGES)。
            # 読めるのは kivra 側の対応 PR(feat/db-migration-credentials)がマージされたイメージのみ。それ以前のイメージは未知の env を無視する。
            - name: KIVRA_DB_MIGRATION_USER
              value: "kivra-migrator"
            - name: KIVRA_DB_MIGRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kivra-db-migrator
                  key: pass
            - name: KIVRA_RUNTIME_ENV
              value: "server"
            - name: KIVRA_DEV_DEMO_ENABLED
              value: "false"
            - name: KIVRA_FUSHA_STATUS_WRITE_ENABLED
              value: "false"
            - name: KIVRA_METRICS_ENABLED
              value: "false"
            # Task API(/api/tasks、/api/runs)を、Keycloak のアクセストークン(JWT)を kivra 自身が検証して有効にする(kivra#116)。
            # このクラスタの CNI は Flannel で NetworkPolicy を実行しないため、oauth2-proxy のヘッダーを信頼する方式は使えない。
            # 署名・iss・aud・exp・ロールを検証するので、偽装されたトークンは、クラスタ内の Pod からでも拒否される。
            - name: KIVRA_AUTH_MODE
              value: "oidc-jwt"
            - name: KIVRA_OIDC_ISSUER
              value: "https://user.kigawa.net/realms/kigawa-net"
            # Keycloak の kivra-dev クライアントの audience mapper(k8s-system#275)が aud に入れる値
            - name: KIVRA_OIDC_AUDIENCE
              value: "kivra-dev"
            # admin-panel クライアントの admin ロール(resource_access.admin-panel.roles)のみ
            - name: KIVRA_OIDC_REQUIRED_ROLE
              value: "admin-panel:admin"
            - name: KIVRA_FUSHA_ENV
              value: "dev"
            # 自己開発(KIVRA_SELFDEV_ENABLED は未設定=無効)が GitHub App(kivra-gh)として認証するための設定。
            # 無効の間は読まれない。App ID / インストール ID は秘密ではない。秘密鍵はマウントしたファイルのパスで渡す。
            - name: KIVRA_SELFDEV_GITHUB_APP_ID
              value: "5339566"
            - name: KIVRA_SELFDEV_GITHUB_APP_INSTALLATION_ID
              value: "171932237"
            - name: KIVRA_SELFDEV_GITHUB_APP_PRIVATE_KEY
              value: "/var/run/kivra/github-app/private-key.pem"
            # マージ検証(PR の作者照合)に使う、GitHub App(kivra-gh)の bot の user id。秘密ではない。
            # 調べ方: gh api /users/kivra-gh%5Bbot%5D --jq .id
            - name: KIVRA_SELFDEV_GITHUB_APP_BOT_USER_ID
              value: "343288952"
            # 自己開発が Anthropic API に認証するための Workload Identity Federation(静的 API キーは使わない)。
            # 以下の ID は秘密ではない。JWT は projected ServiceAccount トークン(下の anthropic-token)を毎回読み直す。
            - name: KIVRA_SELFDEV_ANTHROPIC_FEDERATION_RULE_ID
              value: "fdrl_01WihqEEcLc4oG7oufUtSqHm"
            - name: KIVRA_SELFDEV_ANTHROPIC_ORGANIZATION_ID
              value: "e1c1d300-e0a4-440c-badb-98548fdf42dc"
            - name: KIVRA_SELFDEV_ANTHROPIC_SERVICE_ACCOUNT_ID
              value: "svac_01A9uD3ntRek4ZWKFBq3FFJM"
            - name: KIVRA_SELFDEV_ANTHROPIC_WORKSPACE_ID
              value: "wrkspc_01E6uq7ZNqUrt7p9oyiJgPVL"
            - name: KIVRA_SELFDEV_ANTHROPIC_IDENTITY_TOKEN_FILE
              value: "/var/run/secrets/anthropic.com/token"
            # 自己開発を有効にする(ADR 0008)。止めるときはこの変数を外して再デプロイする(キルスイッチ)。
            - name: KIVRA_SELFDEV_ENABLED
              value: "true"
            # 自己開発のコーディング実行方式。api(既定)= 1 回のモデル呼び出し、cli = ローカル PC の kivra-agent が rootless docker 内で Claude Code CLI を実行する(ADR 0010、Issue kigawa-net/kivra#187)。
            # cli は KIVRA_AGENT_API_ENABLED=true が必要(起動時に検査される)。止める(api に戻す)ときはこの行を外して再デプロイする。
            # cli の間にローカルエージェントが止まっていると、attempt は claim されず lease 切れで ORPHANED → Run は UNKNOWN になる(運用者が解放する)。
            - name: KIVRA_SELFDEV_RUNTIME
              value: "cli"
            - name: KIVRA_SELFDEV_MODEL_REGISTRY_PATH
              value: "/var/run/kivra/model-registry/model-registry.yaml"
            # 為替(USD→JPY)。基準日から 7 日を過ぎると USD の呼び出しは UNKNOWN_COST で止まるので、週次の更新が要る。
            # 165 は 52 週最高値(約 164 円)を上回る、費用を多めに見積もる値(kivra がさらに余裕 10% と税 10% を上乗せ)。
            - name: KIVRA_FX_USD_JPY
              value: "165"
            - name: KIVRA_FX_AS_OF
              value: "2026-10-16"
            - name: KIVRA_BUDGET_MONTHLY_LIMIT_JPY
              value: "10000"
            # ローカルエージェント用 API(/api/agent/v1/*)の認可の設定。
            # KIVRA_AGENT_API_ENABLED: 有効化した(エージェント本体 PR 5〜10 が完了し、live-smoke が通った 2026-10-17)。止めるときはこの変数を外して再デプロイする(キルスイッチ)。有効でも KIVRA_SELFDEV_RUNTIME が api の間は attempt が作られないので、エージェントは何も claim しない。
            - name: KIVRA_AGENT_API_ENABLED
              value: "true"
            # 値は Keycloak の client kivra-agent(k8s-system#278)と一致させる。
            - name: KIVRA_AGENT_AZP
              value: "kivra-agent"
            - name: KIVRA_AGENT_REQUIRED_ROLE
              value: "kivra-agent:agent"
            # 同時に進める自己開発 Run の上限。UNKNOWN の Run は運用者の解放(未実装)まで active として数えられるので、
            # 診断の再現のため暫定で 2 にする(解放の機能が入ったら 1 に戻す)。
            - name: KIVRA_SELFDEV_MAX_ACTIVE_RUNS
              value: "2"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: github-app
              mountPath: /var/run/kivra/github-app
              readOnly: true
            - name: anthropic-token
              mountPath: /var/run/secrets/anthropic.com
              readOnly: true
            - name: model-registry
              mountPath: /var/run/kivra/model-registry
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            # Flyway の migration は、遅いディスクで数十分かかりうる。強制終了されると migration が中途半端な状態で残る。
            failureThreshold: 360
          # readiness は /ready を見る (DB 疎通を確認する)。DB が落ちたら Ready を外してトラフィックを止める。
          # startup と liveness は /health のまま。liveness が DB に依存すると、DB 障害で再起動が繰り返され、migration の途中で強制終了されるおそれがあるため。
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
        # BitwardenSecret(kivra-github-app-bws.yaml)が作る Secret。同期前でも pod が起動できるよう optional にする
        - name: github-app
          secret:
            secretName: kivra-github-app
            optional: true
            defaultMode: 0440
        # Anthropic Workload Identity Federation 用の projected ServiceAccount トークン(kubelet が期限前にローテーションする)。
        # audience はフェデレーションルールの audience と一致させる。automountServiceAccountToken: false でも、この projection は有効。
        - name: model-registry
          configMap:
            name: kivra-model-registry-cm
            items:
              - key: model-registry.yaml
                path: model-registry.yaml
        - name: anthropic-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: https://api.anthropic.com
                  expirationSeconds: 3600
                  path: token
      restartPolicy: Always
