# MAAS の Region を、k8s の外(control-plane のホスト)の Rack に、固定の VIP で公開する(kigawa-net/infra#207)。
#
# Rack(k8s2 / k8s4 のホストに deb で直接入れたもの)の maas-agent は、Rack の登録の URL のホスト(controllers)の tcp 5271(Temporal)に接続する。
# 以前の URL(https://maas.kigawa.net/MAAS)のホストは Ingress の VIP(10.0.0.240)で、80/443 しか公開していないため、
# maas-agent が connection refused で、約 1 分ごとに、クラッシュと再起動を繰り返していた。
# この Service の VIP(10.0.0.244)を、Rack の登録の URL(http://10.0.0.244:5240/MAAS)に使う。Pod が作り直されても、VIP は変わらない。
#
# 公開するのは、API(5240)と Temporal(5271)だけ。Temporal を、LAN 全体に、公開しないよう、loadBalancerSourceRanges で、2 台の Rack だけに絞る。
# RPC(5250〜5253)は、Rack が /rpc/ で得た Pod の IP に、Flannel 経由で、直接、接続する(container=docker で、Pod の IP が広告される)ので、公開しない。
apiVersion: v1
kind: Service
metadata:
  name: maas-region-lb
  namespace: kigawa-net-maas
  labels:
    app: maas-region
spec:
  type: LoadBalancer
  loadBalancerIP: 10.0.0.244
  externalTrafficPolicy: Local
  # k8s2(10.0.0.120 / 192.168.1.20)と k8s4(10.0.0.140 / 192.168.1.120)。VIP への経路によって、送信元のアドレスが、どちらにもなりうる。
  loadBalancerSourceRanges:
    - 10.0.0.120/32
    - 10.0.0.140/32
    - 192.168.1.20/32
    - 192.168.1.120/32
  selector:
    app: maas-region
  ports:
    - name: api
      port: 5240
      targetPort: 5240
    - name: temporal
      port: 5271
      targetPort: 5271
