apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-region
  namespace: kigawa-net-maas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-region
  template:
    metadata:
      labels:
        app: maas-region
    spec:
      # MAAS は region コントローラーを、/var/lib/maas/maas_id(Pod を作り直すと消える)か、無ければ hostname で識別する。
      # hostname が Pod 名のままだと、再起動・更新のたびに新しいコントローラーが登録され、古い登録が残り続ける
      # (2026-10-20 時点で 44 件。API の version も、最も多いバージョン=古い 3.5.10 を返していた)。
      # hostname を固定すると、作り直した Pod が、同じコントローラーに紐づく(手元の Docker で確認済み。kigawa-net/infra#207)。
      hostname: maas-region
      initContainers:
        # DBが起動するまで待機
        - name: wait-postgres
          image: postgres:14
          command:
            - sh
            - -c
            - |
              until pg_isready -h maas-postgres-svc -U $POSTGRES_USER; do
                echo "Waiting for postgres..."
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: maas-postgres
                  key: user
      containers:
        - name: maas-region
          image: harbor.kigawa.net/library/maas-region:main-d9d04bdfc1103a8dec308b64ac2738300b61ab90
          imagePullPolicy: IfNotPresent
          # systemd実行に必要
          securityContext:
            privileged: true
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
          env:
            # MAAS は、`systemd-detect-virt -c` の終了コードで「コンテナ内か」を判定する(provisioningserver/utils/ps.py)。
            # コンテナ内と判定されないと、Pod の eth0 が広告の対象から外れ、/rpc/ が 127.0.0.1 / ::1 だけを返す。
            # すると、k8s の外(ホスト)の Rack が、自分の loopback に接続しようとして、Region に登録できない(kigawa-net/infra#207)。
            # このコンテナは、systemd を PID 1 で動かす(/sbin/init)。PID 1 の環境変数 container=docker を、systemd が読み取り、
            # /run/systemd/container に書いて、コンテナ内と判定されるようになる(手元の Docker で、広告が Pod の IP になることを確認済み)。
            - name: container
              value: docker
            - name: MAAS_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: maas-postgres
                  key: user
            - name: MAAS_POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: maas-postgres
                  key: pass
            - name: MAAS_POSTGRES_HOST
              value: "maas-postgres-svc"
            - name: MAAS_POSTGRES_DB
              value: "maas"
            - name: MAAS_SECRET
              valueFrom:
                secretKeyRef:
                  name: maas-secret
                  key: secret
            # MAAS Region URL (rack controllerが接続するURL)
            - name: MAAS_URL
              value: "http://maas-region-svc.kigawa-net-maas.svc.cluster.local:5240/MAAS"
          ports:
            - containerPort: 5240
              name: api
          startupProbe:
            httpGet:
              path: /MAAS/
              port: 5240
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /MAAS/
              port: 5240
            periodSeconds: 30
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
