apiVersion: v1
kind: PersistentVolume
metadata:
  name: rook-cephfs-user
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 7Ti
  csi:
    driver: kigawa-system-rook-ceph.cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: rook-csi-cephfs-node-user
      namespace: kigawa-system-rook-ceph
    volumeAttributes:
      clusterID: kigawa-system-rook-ceph
      fsName: rook-cephfs
      staticVolume: "true"
      # Scoped to the "user" subtree only (not "/", the whole shared cephfs
      # root) so this mount can't reach other apps' PVC data under
      # /volumes/csi/... and so `occ files:scan` has a bounded tree to walk
      # instead of hanging on the entire cluster's filesystem.
      rootPath: /user
    volumeHandle: rook-cephfs-user-static
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rook-cephfs-user
  namespace: kigawa-net-nextcloud
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 7Ti
  storageClassName: ""
  volumeName: rook-cephfs-user
