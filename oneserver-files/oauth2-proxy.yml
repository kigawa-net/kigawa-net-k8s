apiVersion: v1
kind: Secret
metadata:
  name: oneserver-files-oauth2-proxy-secret
  namespace: kigawa-net-oneserver-files
type: Opaque
stringData:
  # bearer-only モード(--skip-jwt-bearer-tokens)では実際のOAuthログインフローを
  # 使わないため、client-id/client-secret/cookie-secretはoauth2-proxyの起動要件を
  # 満たすためだけのダミー値。秘匿情報ではない。
  # cookie-secretはAES鍵として使われるため厳密に16/24/32バイトである必要がある
  # (oauth2-proxyはこれ以外の長さだと起動時にCrashLoopBackOffする)。
  client-id: oneserver-files
  client-secret: unused
  cookie-secret: "af0e0253518f4310d0f2b0e61badb826"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oneserver-files-oauth2-proxy
  namespace: kigawa-net-oneserver-files
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oneserver-files-oauth2-proxy
  template:
    metadata:
      labels:
        app: oneserver-files-oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:latest
          args:
            - --provider=oidc
            # 実際のログインフローは使わないため既存Keycloakレルムを流用(起動要件を満たすためだけ)
            - --oidc-issuer-url=https://user.kigawa.net/realms/manage
            - --upstream=http://oneserver-file-server:8080
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --skip-provider-button=true
            - --pass-authorization-header=true
            - --pass-access-token=true
            # Bearer JWTでの機械間認証のみを許可し、ブラウザOAuthフローは使わない
            - --skip-jwt-bearer-tokens=true
            # GitHub Actions(RpgCore CI)のOIDCトークンを検証
            - --extra-jwt-issuers=https://token.actions.githubusercontent.com=https://files.kigawa.net
            # クラスタ自身のService Account issuer(world-exporter/world-image-builder用)
            # 確認コマンド: kubectl get --raw /.well-known/openid-configuration | jq -r .issuer
            - --extra-jwt-issuers=https://kubernetes.default.svc.cluster.local=https://files.kigawa.net
            # kubernetes.default.svc.cluster.localの証明書はクラスタ内部CA発行のため、
            # oauth2-proxyのデフォルト信頼ストアでは検証できず上記issuerの鍵取得が
            # 常に失敗していた。Pod自動マウントのSAトークン用CA証明書を明示的に信頼する。
            - --provider-ca-file=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oneserver-files-oauth2-proxy-secret
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oneserver-files-oauth2-proxy-secret
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oneserver-files-oauth2-proxy-secret
                  key: cookie-secret
          ports:
            - containerPort: 4180
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oneserver-files-oauth2-proxy
  namespace: kigawa-net-oneserver-files
spec:
  selector:
    app: oneserver-files-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
