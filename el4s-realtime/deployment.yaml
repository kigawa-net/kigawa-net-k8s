apiVersion: apps/v1
kind: Deployment
metadata:
  name: el4s-realtime
  namespace: kigawa-net-el4s-realtime
  labels:
    app: el4s-realtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: el4s-realtime
  template:
    metadata:
      labels:
        app: el4s-realtime
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: el4s-realtime
          image: harbor.kigawa.net/private/el4s-realtime:main-f6d69a2c3dd8304dc6d5234228b412ddc909e076
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
