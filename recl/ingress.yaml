apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recl
  namespace: kigawa-net-recl
spec:
  ingressClassName: haproxy
  rules:
    - host: recl.kigawa.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: recl
                port:
                  number: 80
