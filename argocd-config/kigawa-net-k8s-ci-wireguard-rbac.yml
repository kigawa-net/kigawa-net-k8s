# kigawa-net-k8s の PR CI(.github/workflows/ci.yml)dry-runジョブが
# GitHub-hosted ubuntu-latest + WireGuardトンネル経由でクラスタAPI(k8s.kigawa.net)へ
# 接続する際に使う、専用ServiceAccount。
#
# 既存のkigawa-net-k8s-ci-dryrun ClusterRole(kigawa-net-k8s-ci-dryrun-rbac.yml)を
# 再利用しつつ、共有ランナープールのarc-runner-set-gha-rs-no-permissionとは別の
# 専用ServiceAccountにバインドし直す(WireGuard経由の接続元はGitHub-hosted
# ubuntu-latestであり、共有arc-runnerプールとは異なる識別子で権限を分離する)。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-wireguard-dryrun
  namespace: arc-runners
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-wireguard-dryrun-token
  namespace: arc-runners
  annotations:
    kubernetes.io/service-account.name: ci-wireguard-dryrun
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kigawa-net-k8s-ci-wireguard-dryrun
  namespace: arc-runners
subjects:
  - kind: ServiceAccount
    name: ci-wireguard-dryrun
    namespace: arc-runners
roleRef:
  kind: ClusterRole
  name: kigawa-net-k8s-ci-dryrun
  apiGroup: rbac.authorization.k8s.io
