# kigawa-net-k8s 自身のPR CI(.github/workflows/ci.yml)が `kubectl apply --dry-run=server`
# でCRD込みの検証をするための権限。
#
# ClusterRole自体はClusterRoleBindingで束ねず、このリポジトリが実際に管理している各
# namespaceにRoleBindingとして個別に配ることで、権限をそのnamespace内に閉じている。
# dry-runは何も永続化しないが、RBAC上は本物のcreate/update/patchと同じverbが必要な
# ため、新しいnamespaceを追加する場合は下のRoleBinding一覧にも追記すること。
# ServiceAccountはARC runnerの共有アカウント(arc-runner-set-gha-rs-no-permission)で
# あり、この権限は同じrunnerプールを使う他リポジトリのCIジョブからも技術的には行使
# 可能な点に注意(RpgCore PR previewの既存RBACと同じ制約)。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kigawa-net-k8s-ci-dryrun
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kigawa-net-k8s-ci-dryrun
  namespace: arc-runners
subjects:
  - kind: ServiceAccount
    name: arc-runner-set-gha-rs-no-permission
    namespace: arc-runners
roleRef:
  kind: ClusterRole
  name: kigawa-net-k8s-ci-dryrun
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
