# headless Service(StatefulSet の Pod の DNS 用)
apiVersion: v1
kind: Service
metadata:
  name: karmada-etcd
  namespace: karmada-etcd
  labels:
    app: karmada-etcd
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: karmada-etcd
  ports:
    - name: client
      port: 2379
    - name: peer
      port: 2380
---
# VIP 10.0.0.243(MetalLB main-pool)。external etcd のエンドポイントで、将来の member も
# このアドレスを advertise する形に合わせてある(etcd の証明書の SAN に 10.0.0.243 を含む)。
# externalTrafficPolicy: Local で、etcd Pod のいるノードだけが VIP を広告する。
apiVersion: v1
kind: Service
metadata:
  name: karmada-etcd-lb
  namespace: karmada-etcd
  labels:
    app: karmada-etcd
spec:
  type: LoadBalancer
  loadBalancerIP: 10.0.0.243
  externalTrafficPolicy: Local
  selector:
    app: karmada-etcd
  ports:
    - name: client
      port: 2379
      targetPort: client
    - name: peer
      port: 2380
      targetPort: peer
