apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: karmada-etcd
  namespace: karmada-etcd
  labels:
    app: karmada-etcd
spec:
  replicas: 1
  serviceName: karmada-etcd
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: karmada-etcd
  template:
    metadata:
      labels:
        app: karmada-etcd
    spec:
      priorityClassName: system-cluster-critical
      terminationGracePeriodSeconds: 60
      containers:
        - name: etcd
          image: registry.k8s.io/etcd:3.6.8-0
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/etcd
            - --name=inuyama
            - --data-dir=/var/lib/etcd
            # external etcd として公開するアドレス(VIP)。将来の member も同じ形式で advertise する。
            - --listen-client-urls=https://0.0.0.0:2379
            - --advertise-client-urls=https://10.0.0.243:2379
            - --listen-peer-urls=https://0.0.0.0:2380
            - --initial-advertise-peer-urls=https://10.0.0.243:2380
            # 段階 1 は単独で起動する。3 member にするときは `etcdctl member add` で足す
            # (initial-cluster に未起動の member を書くと、起動できなくなる)。
            - --initial-cluster=inuyama=https://10.0.0.243:2380
            - --initial-cluster-state=new
            - --initial-cluster-token=karmada-etcd-prod
            - --client-cert-auth=true
            - --trusted-ca-file=/etc/etcd/pki/ca.crt
            - --cert-file=/etc/etcd/pki/tls.crt
            - --key-file=/etc/etcd/pki/tls.key
            - --peer-client-cert-auth=true
            - --peer-trusted-ca-file=/etc/etcd/pki/ca.crt
            - --peer-cert-file=/etc/etcd/pki/tls.crt
            - --peer-key-file=/etc/etcd/pki/tls.key
            # Inuyama ↔ IONOS の RTT は約 157ms。3 member で同じ値を使う(既定は 100ms / 1000ms)。
            - --heartbeat-interval=500
            - --election-timeout=5000
            # peer のクライアント証明書の SAN と、接続元の IP の照合を外す(署名した CA の検証は残る)。
            # 3 拠点の peer 通信は、NAT・flannel の SNAT を経由し、接続元が証明書の SAN と一致しない
            # (Soichiro → Inuyama は 172.16.8.0、Inuyama → Soichiro は 192.168.1.130)。issue #272。
            # 根本対応(送信元を証明書に合わせる)は、#272 の案 B。
            - --peer-skip-client-san-verification=true
            - --quota-backend-bytes=4294967296
            - --listen-metrics-urls=http://0.0.0.0:2381
            - --logger=zap
            - --log-level=info
          ports:
            - name: client
              containerPort: 2379
            - name: peer
              containerPort: 2380
            - name: metrics
              containerPort: 2381
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            # ディスクが遅いときに liveness で再起動を繰り返さないよう、緩めにしてある
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 10
          startupProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 5
            failureThreshold: 60
          # requests = limits で Guaranteed QoS(メモリ逼迫での退避の順位を最後にする)
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 250m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/etcd
            - name: pki
              mountPath: /etc/etcd/pki
              readOnly: true
      # etcd のデータは、worker3(ベアメタル SSD)のローカルディスクに置く。
      # Ceph RBD の PVC では、etcdctl check perf が 11 writes/s・最大 8.1 秒・タイムアウトで FAIL し、
      # wal_fsync の中央値が約 0.5 秒だった(2026-10-04 実測)。worker3 のローカルは fsync 0.6ms/回(実測)。
      # ローカルディスクなので、etcd は worker3 に固定される(ほかのノードでは同じデータを使えない)。
      # 3 member 化したあとは、etcd の Raft の複製が冗長性を担う。
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker3
      volumes:
        - name: data
          hostPath:
            path: /var/lib/karmada-etcd
            type: DirectoryOrCreate
        - name: pki
          secret:
            secretName: karmada-etcd-server
            defaultMode: 0400
