apiVersion: apps/v1
kind: Deployment
metadata:
  name: fomage
  labels:
    app: fomage
spec:
  replicas: 0
  selector:
    matchLabels:
      app: fomage
  template:
    metadata:
      name: fomage
      labels:
        app: fomage
    spec:
      containers:
        - name: fomage
          image: harbor.kigawa.net/library/fomage:main-6db7bbb252c32c31b7d9b2dcc37a214abdc71db3
          imagePullPolicy: IfNotPresent
          startupProbe:
            httpGet:
              port: 8080
              path: /health
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: MONGODB_URI
              value: mongodb://mongo-svc.fonsole.svc.cluster.local:27017/fomage
            - name: MONGODB_DATABASE
              value: fomage
            - name: SERVER_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: INFO
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  key: user
                  name: mongo
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: pass
                  name: mongo
            # Keycloak(OIDC)認証。prodはmanageレルム(高権限アカウント向け)を使用
            - name: KEYCLOAK_URL
              value: https://user.kigawa.net
            - name: KEYCLOAK_REALM
              value: manage
            - name: KEYCLOAK_CLIENT_ID
              value: fomage
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fomage-keycloak
                  key: client-secret
      restartPolicy: Always
