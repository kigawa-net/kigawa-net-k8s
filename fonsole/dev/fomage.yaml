apiVersion: apps/v1
kind: Deployment
metadata:
  name: fomage
  labels:
    app: fomage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fomage
  template:
    metadata:
      name: fomage
      labels:
        app: fomage
    spec:
      containers:
        - name: fomage
          image: harbor.kigawa.net/library/fomage:pr-5-f233623a50c33aad0a5a5232018926c52d8ccd25
          imagePullPolicy: IfNotPresent
          startupProbe:
            httpGet:
              port: 8080
              path: /health
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            # dev専用のダミーMongoDB(fonsole/dev/mongo.yaml)を参照。本番DBとは無関係。
            - name: MONGODB_URI
              value: mongodb://fomage-mongo-svc:27017/fomage
            - name: MONGODB_DATABASE
              value: fomage
            - name: SERVER_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: INFO
      restartPolicy: Always
