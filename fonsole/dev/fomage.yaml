apiVersion: apps/v1
kind: Deployment
metadata:
  name: fomage
  labels:
    app: fomage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fomage
  template:
    metadata:
      name: fomage
      labels:
        app: fomage
    spec:
      containers:
        - name: fomage
          image: harbor.kigawa.net/library/fomage:pr-3-5542cbe9bccbca6fc4155346bc45e6bcfe2c862e
          imagePullPolicy: IfNotPresent
          startupProbe:
            httpGet:
              port: 8080
              path: /health
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            # dev専用のダミーMongoDB(fonsole/dev/mongo.yaml)を参照。本番DBとは無関係。
            - name: MONGODB_URI
              value: mongodb://fomage-mongo-svc:27017/fomage
            - name: MONGODB_DATABASE
              value: fomage
            - name: SERVER_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: INFO
            # Keycloak(OIDC)認証。dev/stgはdevelopレルムを共用
            - name: KEYCLOAK_URL
              value: https://user.kigawa.net
            - name: KEYCLOAK_REALM
              value: develop
            - name: KEYCLOAK_CLIENT_ID
              value: fomage
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fomage-keycloak
                  key: client-secret
      restartPolicy: Always
