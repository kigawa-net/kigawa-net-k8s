# dev環境専用のダミーMongoDB。本番(fonsole)のMongoDBとは完全に分離されており、
# 認証なし・ダミーデータのみを保持する(PRごとの動作確認用)。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fomage-mongo-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: rook-ceph-rbd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fomage-mongo
  labels:
    app: fomage-mongo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fomage-mongo
  template:
    metadata:
      name: fomage-mongo
      labels:
        app: fomage-mongo
    spec:
      # mongo 5.0 以降は AVX 命令が必須。AVX の無いノード
      # (k8s-worker1 / k8s1 / k8s4)に載ると CrashLoopBackOff する
      # (2026-11-12 の worker4 drain で発生)。NFD の AVX2 ラベルで限定する。
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/cpu-cpuid.AVX2
                    operator: In
                    values: ["true"]
      containers:
        - name: mongo
          image: mongo:7.0
          ports:
            - containerPort: 27017
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fomage-mongo-data
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: fomage-mongo-svc
spec:
  selector:
    app: fomage-mongo
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
  type: ClusterIP
