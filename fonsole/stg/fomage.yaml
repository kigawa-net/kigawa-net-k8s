apiVersion: apps/v1
kind: Deployment
metadata:
  name: fomage
  labels:
    app: fomage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fomage
  template:
    metadata:
      name: fomage
      labels:
        app: fomage
    spec:
      containers:
        - name: fomage
          image: harbor.kigawa.net/library/fomage:main-0a4648f7bdfd043f2ff86e32a746424b72de61ad
          imagePullPolicy: IfNotPresent
          startupProbe:
            httpGet:
              port: 8080
              path: /health
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            # stg専用のMongoDB(fonsole/stg/mongo.yaml、本番データの一部を投入)を参照。
            - name: MONGODB_URI
              value: mongodb://fomage-mongo-svc:27017/fomage
            - name: MONGODB_DATABASE
              value: fomage
            - name: SERVER_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: INFO
            # Keycloak(OIDC)認証。dev/stgはdevelopレルムを共用
            - name: KEYCLOAK_URL
              value: https://user.kigawa.net
            - name: KEYCLOAK_REALM
              value: develop
            - name: KEYCLOAK_CLIENT_ID
              value: fomage
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fomage-keycloak
                  key: client-secret
      restartPolicy: Always
