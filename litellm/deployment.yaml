apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: kigawa-net-llm-proxy
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
      annotations:
        config-version: "12"
    spec:
      # 順番待ちを含む長い要求(最大 6 時間。request_timeout 21600 秒)が、再起動の間も、終わるまで待たれるようにする。
      # 既定の 30 秒だと、再起動のたびに、処理中の要求が切られ、クライアントに 502 が返る(2026-11-15 に発生)。
      # uvicorn は、終了の合図(SIGTERM)のあと、新しい接続を受けず、処理中の要求が終わるまで待つ
      terminationGracePeriodSeconds: 21600
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          lifecycle:
            preStop:
              exec:
                # 終了の合図の前に、Service のエンドポイントから外れる時間を作り、新しい要求が、終了中の Pod に届かないようにする
                command: ["/bin/sh", "-c", "sleep 10"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              export ENCODED_PASSWORD=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['DB_PASSWORD'],safe=''))")
              export DATABASE_URL="postgresql://litellm:${ENCODED_PASSWORD}@postgresql.kigawa-net-llm-proxy.svc.cluster.local:5432/litellm"
              exec litellm --config /app/config.yaml --port 4000 --num_workers 1
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: master-key
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: vllm-api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: openai-api-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: anthropic-api-key
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: db-password
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: config
          configMap:
            name: litellm-config
