apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: kigawa-net-llm-proxy
data:
  config.yaml: |
    model_list:
      - model_name: production-llm
        litellm_params:
          model: openai/production-llm
          api_base: http://vllm-openai-service.kigawa-net-llm.svc.cluster.local/v1
          # 並列数の制限(max_parallel_requests)は、つけない。つけると、超えた要求は 429 で拒否され、
          # 再試行(約 7.5 秒間隔)で待つことになり、到着順にならない(順番が入れ替わり、待ちが長くなる人が出る)。
          # 全要求を、そのまま llama.cpp に渡す。llama.cpp は、全スロット(-np)がふさがっていると、
          # 要求を、**到着順(FIFO)**に待たせて、1 つずつ処理する(手元の llama.cpp で、4 同時の要求が、
          # 到着順に完了することを確認済み)。実行中の数は、-np で決まるので、GPU・メモリへの負荷は、増えない。
          # 待ちの上限は、request_timeout(21600 秒)と、ingress の timeout-server(21600 秒)。リレーと OpenCode の
          # headerTimeout も同じ値に揃えること。それを超える待ちは、タイムアウトになる(クライアントが切れると、待ち行列からも外れる)
          api_key: os.environ/VLLM_API_KEY
          # litellm_settings.request_timeout はデプロイメント単位の timeout に反映されず、ログ上は
          # "Deployment Info: request_timeout: None / timeout: None / stream_timeout: None" になっている。
          # その状態で「Timeout on reading data from socket」(APITimeoutError)が多発しているため、ここで明示する。
          # 順番待ち中は llama.cpp から最初のバイトが来ないので、上の待ちの上限と同じ値にする
          timeout: 21600
          stream_timeout: 21600
          # 上流 SDK 内の即時再試行を止め、間隔を空ける再試行は Router に任せる。
          max_retries: 0
      - model_name: gpt-4o
        litellm_params:
          model: gpt-4o
          api_key: os.environ/OPENAI_API_KEY
      - model_name: gpt-4o-mini
        litellm_params:
          model: gpt-4o-mini
          api_key: os.environ/OPENAI_API_KEY
      - model_name: claude-sonnet-4-6
        litellm_params:
          model: anthropic/claude-sonnet-4-6-20250220
          api_key: os.environ/ANTHROPIC_API_KEY

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY

    litellm_settings:
      drop_params: true
      # 上流(llama.cpp)は、全スロットがふさがっていると要求を順番待ちにする。遅い応答(思考ありの長い生成。1 件で平均約 2 分、最大約 6 分)の順番待ちが重なると、
      # 1800 秒(30 分)では足りないため 21600 秒(6 時間)にする。待ちが長いときは、ingress・oauth2-proxy・リレー・OpenCode も、同じ値にすること
      request_timeout: 21600

    router_settings:
      # 共通の再試行設定。production-llm の設定は下のモデルグループポリシーを参照する。
      # タイムアウトを再試行すると、順番待ちの負荷が倍になるため 0 にする
      num_retries: 30
      retry_after: 10
      retry_policy:
        TimeoutErrorRetries: 0
        InternalServerErrorRetries: 30
        # production-llm の順番待ちは、llama.cpp のキューが担う(上の model_list の説明)ので、ここでの再試行は不要。
        # ただし、仮想キー単位の制限(max_parallel_requests、rpm_limit)に当たった 429 のために、再試行を残す
        # (約 7.5 秒間隔で、最大 70 回 = 約 9 分)。キーの制限は、セッション数より十分大きくしておくこと
        RateLimitErrorRetries: 70
        BadRequestErrorRetries: 0
        AuthenticationErrorRetries: 0
        ContentPolicyViolationErrorRetries: 0
      # LiteLLM 1.110.0 では、初回エラーに対してモデルグループ固有のポリシーが共通設定に優先する。
      # OpenAI 互換上流への接続エラーは InternalServerError に分類される。
      # retry_after: 10 では、Retry-After がない場合に約8〜8.75秒ずつ待つため、75回で約10分を見込む。
      # 再試行の途中でエラー種別が変わっても、初回エラーで決まった回数が適用される場合がある。
      model_group_retry_policy:
        production-llm:
          DefaultRetries: 0
          InternalServerErrorRetries: 75
          ServiceUnavailableErrorRetries: 75
          TimeoutErrorRetries: 0
          RateLimitErrorRetries: 0
          BadRequestErrorRetries: 0
          AuthenticationErrorRetries: 0
          ContentPolicyViolationErrorRetries: 0
          NotFoundErrorRetries: 0
