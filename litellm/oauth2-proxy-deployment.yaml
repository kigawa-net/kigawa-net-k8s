apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-oauth2-proxy
  namespace: kigawa-net-llm-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-oauth2-proxy
  template:
    metadata:
      labels:
        app: litellm-oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://user.kigawa.net/realms/develop
            # Bearer JWT(client_credentials)での機械間認証のみ。ブラウザのログインフローは使わない
            - --skip-jwt-bearer-tokens=true
            - --oidc-extra-audience=litellm
            # サービスアカウントのトークンには email が無いため sub を使う
            - --oidc-email-claim=sub
            - --email-domain=*
            - --skip-provider-button=true
            - --upstream=http://litellm-service.kigawa-net-llm-proxy.svc.cluster.local:80
            - --http-address=0.0.0.0:4180
            - --alpha-config=/etc/oauth2-proxy/alpha.yaml
            # クライアントの Authorization は上流に渡さない(仮想キーで置き換える)
            - --pass-authorization-header=false
            - --pass-access-token=false
          env:
            # Bearer 専用モードでは使われない。起動要件を満たすためのダミー値(秘匿情報ではない)。
            # cookie-secret は 16/24/32 バイトである必要がある
            - name: OAUTH2_PROXY_CLIENT_ID
              value: litellm-api
            - name: OAUTH2_PROXY_CLIENT_SECRET
              value: unused
            - name: OAUTH2_PROXY_COOKIE_SECRET
              value: "0123456789abcdef0123456789abcdef"
            - name: LITELLM_VIRTUAL_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-opencode-dev-key
                  key: virtual-key
            - name: LITELLM_AUTH_HEADER
              value: "Bearer $(LITELLM_VIRTUAL_KEY)"
          ports:
            - containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
          volumeMounts:
            - name: config
              mountPath: /etc/oauth2-proxy
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: litellm-oauth2-proxy-config
