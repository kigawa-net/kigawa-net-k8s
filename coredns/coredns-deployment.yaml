# CoreDNS (kube-system) の Deployment を GitOps 管理下に置く。
#
# これまでこの Deployment は kubeadm が作成するリソースであり、Git に manifest が
# 存在しなかった。そのため `kubeadm upgrade` やノード再構築の際に Deployment の
# 設定が飛ぶ恐れがあった。ここでは kubeadm 管理の標準 Deployment を GitOps 化して
# (`kubeadm upgrade` での消失を防ぐ)、意図した設定
# (affinity / tolerations / priorityClassName / resources 等)を明示的に維持できるようにする。
#
# 前提:
# - ArgoCD app `coredns` の syncPolicy は `automated.prune: false` かつ
#   `syncOptions: ApplyOutOfSyncOnly=true`。本リソースは ArgoCD が adopt する新規
#   リソースであり、`prune: false` を前提に既存リソースへの破壊的変更は発生しない。
# - 内容は 2026-10-03 時点のクラスタ実体の spec を正として dump している
#   (kubectl get deployment -n kube-system coredns -o json)。
#   Pod テンプレート (spec.template) が完全に同一なので、adopt 時に Pod が
#   再起動することはない。
#
# API サーバ/kubelet がデフォルトとして埋めるフィールド
# (revisionHistoryLimit / progressDeadlineSeconds / restartPolicy / schedulerName /
#  terminationMessagePath / terminationMessagePolicy / serviceAccount) も省略せず
# 明示的にpin している。意図的な差分は ArgoCD の OutOfSync 判定や差分表示の
# 挙動に依存するため、live と完全一致させて恒常的な OutOfSync を防ぐ。
# （なお spec.template.metadata.creationTimestamp 等のサーバ管理フィールドは
#   除外している。これらは ArgoCD が正規化で無視する。）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
spec:
  replicas: 2
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: "25%"
      maxUnavailable: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
  template:
    metadata:
      labels:
        k8s-app: kube-dns
    spec:
      serviceAccountName: coredns
      # serviceAccount は serviceAccountName のエイリアス。実体を完全一致させるため
      # 明示している。
      serviceAccount: coredns
      # CoreDNS が止まるとクラスタ全体が DNS 名前解決できなくなるため最重要。
      # kubeadm が付与する標準の優先度クラス。
      priorityClassName: system-cluster-critical
      # kubeadm の標準設定。Default にすることで Pod 自身の resolv.conf を
      # 無視してノードの resolv.conf を使い、CoreDNS 自身が自分自身を
      # 解決しようとして依存陷入するのを避ける。
      dnsPolicy: Default
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: k8s-app
                      operator: In
                      values:
                        - kube-dns
      tolerations:
        # kubeadm が付与する標準 toleration。
        - key: CriticalAddonsOnly
          operator: Exists
        # control-plane ノードへの展開を許可する。
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.11.1
          imagePullPolicy: IfNotPresent
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: metrics
              containerPort: 9153
              protocol: TCP
          resources:
            limits:
              memory: 170Mi
            requests:
              cpu: 100m
              memory: 70Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - name: config-volume
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        # coredns/coredns-configmap.yaml で管理している ConfigMap。
        - name: config-volume
          configMap:
            name: coredns
            defaultMode: 420
            items:
              - key: Corefile
                path: Corefile