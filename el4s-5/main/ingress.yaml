apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: el4s-5
  namespace: kigawa-net-el4s-5
  annotations:
    haproxy.org/timeout-connect: "10s"
    haproxy.org/timeout-server: "120s"
    haproxy.org/timeout-tunnel: "3600s"
spec:
  ingressClassName: haproxy
  rules:
    - host: el4s.kigawa.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: el4s-5
                port:
                  number: 3000
